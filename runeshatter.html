          // Wardfall's STONE_VERTS "chunk with a crack bitten out"
          // grammar on purpose (hazard-adjacent concept), hue kept off
          // the purple family entirely (see the cyan rim below) to avoid
          // a third #b98aff-adjacent collision in this portfolio.
    {a:0.00,m:1.05},{a:0.15,m:0.95},{a:0.30,m:1.08},{a:0.44,m:0.35},
    {a:0.58,m:0.98},{a:0.72,m:0.90},{a:0.88,m:1.02},
  ],
  light: [ // radiant starburst, busiest silhouette (capstone element) —
           // outward ray strokes beyond this outline are added separately
    {a:0.00,m:1.20},{a:0.09,m:0.50},{a:0.20,m:1.10},{a:0.29,m:0.48},
    {a:0.40,m:1.15},{a:0.50,m:0.46},{a:0.62,m:1.10},{a:0.71,m:0.50},
    {a:0.83,m:1.05},{a:0.92,m:0.52},
  ],
};
const LINE_BOMB_VERTS = [ // elongated double-point glyph along one axis,
  // idle-rotated slowly to read as "primed" — distinct from every tile
  // silhouette and from the area bomb's near-round rune-circle.
  {a:0.00,m:1.50},{a:0.10,m:0.45},{a:0.25,m:0.70},
  {a:0.50,m:1.50},{a:0.75,m:0.70},{a:0.90,m:0.45},
];
const AREA_BOMB_VERTS = [ // scalloped rune-circle — a magic-circle idiom
  // reads as intentionally geometric rather than "lazy ngon," backed by
  // orbiting satellite shards drawn separately for further distinction.
  {a:0.02,m:1.02},{a:0.14,m:0.82},{a:0.27,m:1.05},{a:0.39,m:0.80},
  {a:0.52,m:1.00},{a:0.64,m:0.84},{a:0.78,m:1.03},{a:0.90,m:0.81},
];

// rune sigil line-drawing overlay per element — the SECOND half of the
// "paired-glyph" idiom (gem base + rune line), stroked in a bright
// translucent tint over the facet-shaded base. Deliberately simple line
// art, not another filled shape, so it reads as an inscription ON the
// gem rather than a second silhouette competing with the first.
const RUNE_OVERLAYS = {
  fire: (c2,cx,cy,r) => {
    c2.beginPath();
    c2.moveTo(cx, cy-r*0.55); c2.lineTo(cx-r*0.22, cy+r*0.15); c2.lineTo(cx, cy+r*0.02); c2.lineTo(cx+r*0.22, cy+r*0.15);
    c2.closePath();
  },
  frost: (c2,cx,cy,r) => {
    for(let i=0;i<3;i++){
      const ang = i*Math.PI/3;
      c2.moveTo(cx-Math.cos(ang)*r*0.45, cy-Math.sin(ang)*r*0.45);
      c2.lineTo(cx+Math.cos(ang)*r*0.45, cy+Math.sin(ang)*r*0.45);
    }
  },
  verdant: (c2,cx,cy,r) => {
    c2.moveTo(cx, cy+r*0.5);
    c2.quadraticCurveTo(cx-r*0.35, cy, cx, cy-r*0.5);
    c2.quadraticCurveTo(cx+r*0.15, cy, cx, cy+r*0.5);
  },
  lightning: (c2,cx,cy,r) => {
    c2.moveTo(cx-r*0.12, cy-r*0.5); c2.lineTo(cx+r*0.14, cy-r*0.05);
    c2.lineTo(cx-r*0.06, cy+r*0.05); c2.lineTo(cx+r*0.12, cy+r*0.5);
  },
  void: (c2,cx,cy,r) => {
    c2.arc(cx, cy, r*0.4, 0.35*Math.PI*2, 0.85*Math.PI*2);
  },
  light: (c2,cx,cy,r) => {
    c2.moveTo(cx-r*0.4, cy); c2.lineTo(cx+r*0.4, cy);
    c2.moveTo(cx, cy-r*0.4); c2.lineTo(cx, cy+r*0.4);
  },
};

const SPRITE_SIZE = 72;
function buildFacetSprite(verts, baseColor, strokeColor, overlayFn, extra){
  const size = SPRITE_SIZE;
  const cvs = document.createElement('canvas'); cvs.width=size; cvs.height=size;
  const c2 = cvs.getContext('2d');
  const cx=size/2, cy=size/2, r=size*0.38;
  const pts = handVerts(cx, cy, r, verts);
  c2.shadowColor = baseColor; c2.shadowBlur = 12;
  c2.beginPath();
  pts.forEach((v,i)=> i===0?c2.moveTo(v.x,v.y):c2.lineTo(v.x,v.y));
  c2.closePath(); c2.fillStyle = baseColor; c2.fill();
  c2.shadowBlur = 0;
  for(let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[(i+1)%pts.length];
    const lit = i % 2 === 0;
    c2.fillStyle = shadeHex(baseColor, lit ? 16 : -14, lit ? 8 : -6);
    c2.beginPath(); c2.moveTo(cx,cy); c2.lineTo(a.x,a.y); c2.lineTo(b.x,b.y); c2.closePath(); c2.fill();
  }
  c2.fillStyle = 'rgba(255,255,255,0.35)';
  c2.beginPath(); c2.moveTo(cx,cy); c2.lineTo(pts[0].x,pts[0].y); c2.lineTo(pts[pts.length-1].x,pts[pts.length-1].y); c2.closePath(); c2.fill();
  c2.strokeStyle = strokeColor || 'rgba(255,255,255,0.5)'; c2.lineWidth = 1.2;
  c2.beginPath();
  pts.forEach((v,i)=> i===0?c2.moveTo(v.x,v.y):c2.lineTo(v.x,v.y));
  c2.closePath(); c2.stroke();
  if(overlayFn){
    c2.beginPath(); overlayFn(c2, cx, cy, r);
    c2.strokeStyle = 'rgba(255,255,255,0.65)'; c2.lineWidth = 1.6;
    c2.lineCap = 'round'; c2.stroke();
  }
  if(extra) extra(c2, cx, cy, r);
  return cvs;
}
const ELEMENT_SPRITES = {};
for(const key of TILE_TYPE_POOL){
  const strokeColor = key==='void' ? '#4fe6ff' : (key==='light' ? '#fff8e0' : undefined);
  const extra = key==='light' ? (c2,cx,cy,r) => { // outward ray strokes
      // BEYOND the silhouette — reads as distinct from Sigil Chain's own
      // light rune, which only varies point length INSIDE one silhouette.
      c2.strokeStyle = 'rgba(255,248,224,0.55)'; c2.lineWidth = 1;
      for(let i=0;i<8;i++){
        const ang = i*Math.PI/4;
        c2.beginPath();
        c2.moveTo(cx+Math.cos(ang)*r*1.05, cy+Math.sin(ang)*r*1.05);
        c2.lineTo(cx+Math.cos(ang)*r*1.35, cy+Math.sin(ang)*r*1.35);
        c2.stroke();
      }
    } : null;
  ELEMENT_SPRITES[key] = buildFacetSprite(ELEMENT_VERTS[key], TILE_COLORS[key], strokeColor, RUNE_OVERLAYS[key], extra);
}
const BOMB_SPRITES = { line:{}, area:{} };
function bombSpriteFor(kind, elementType){
  const cache = BOMB_SPRITES[kind];
  if(cache[elementType]) return cache[elementType];
  const accent = TILE_COLORS[elementType] || '#ffcb5c';
  const verts = kind==='area' ? AREA_BOMB_VERTS : LINE_BOMB_VERTS;
  const size = SPRITE_SIZE;
  const cvs = document.createElement('canvas'); cvs.width=size; cvs.height=size;
  const c2 = cvs.getContext('2d');
  const cx=size/2, cy=size/2, r=size*0.38;
  const pts = handVerts(cx, cy, r, verts);
  c2.shadowColor = accent; c2.shadowBlur = 16;
  c2.beginPath();
  pts.forEach((v,i)=> i===0?c2.moveTo(v.x,v.y):c2.lineTo(v.x,v.y));
  c2.closePath(); c2.fillStyle = BOMB_BASE; c2.fill();
  c2.shadowBlur = 0;
  for(let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[(i+1)%pts.length];
    const lit = i % 2 === 0;
    c2.fillStyle = lit ? shadeHex(accent, 6, 0) : shadeHex(BOMB_BASE, -8, -4);
    c2.beginPath(); c2.moveTo(cx,cy); c2.lineTo(a.x,a.y); c2.lineTo(b.x,b.y); c2.closePath(); c2.fill();
  }
  c2.strokeStyle = accent; c2.lineWidth = 1.4;
  c2.beginPath();
  pts.forEach((v,i)=> i===0?c2.moveTo(v.x,v.y):c2.lineTo(v.x,v.y));
  c2.closePath(); c2.stroke();
  if(kind==='area'){
    // rune-circle ring + 3 orbiting satellite shards (drawn at t=0; live
    // orbit rotation happens per-frame in drawTile, this bakes the ring)
    c2.strokeStyle = shadeHex(accent, 20, 10); c2.lineWidth = 1;
    c2.beginPath(); c2.arc(cx, cy, r*1.15, 0, Math.PI*2); c2.stroke();
  } else {
    // directional arrow-facet along the bomb's own long axis (baked
    // pointing along a=0/a=0.5 — drawTile rotates the whole sprite to the
    // tile's real row/col axis)
    c2.fillStyle = 'rgba(255,255,255,0.85)';
    c2.beginPath();
    c2.moveTo(cx+r*0.85, cy-r*0.13); c2.lineTo(cx+r*1.05, cy); c2.lineTo(cx+r*0.85, cy+r*0.13);
    c2.closePath(); c2.fill();
  }
  cache[elementType] = cvs;
  return cvs;
}

// board backdrop texture — createPattern(), zero uses anywhere in this
// portfolio before this pass (GAME_7_PILLARS.md §5's capability-audit
// gap). Subtle cracked-stone/arcane-parchment texture, distinct from
// Sigil Chain's flat panel board background.
function buildBoardPattern(ctx0){
  const t = document.createElement('canvas'); t.width=48; t.height=48;
  const tc = t.getContext('2d');
  tc.fillStyle = 'rgba(255,255,255,0.02)'; tc.fillRect(0,0,48,48);
  tc.strokeStyle = 'rgba(255,255,255,0.05)'; tc.lineWidth = 1;
  tc.beginPath();
  tc.moveTo(4,6); tc.lineTo(20,10); tc.lineTo(14,26); tc.lineTo(30,20); tc.lineTo(44,40);
  tc.stroke();
  tc.fillStyle = 'rgba(255,255,255,0.04)';
  for(let i=0;i<6;i++){ tc.beginPath(); tc.arc((i*13+5)%48, (i*19+9)%48, 0.8, 0, Math.PI*2); tc.fill(); }
  return ctx0.createPattern(t, 'repeat');
}

const Render = (function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W=0, H=0, dpr=1;
  let boardX=0, boardY=0, cell=40;
  const N = BOARD_SIZE;
  const boardPattern = buildBoardPattern(ctx);

  function layout(){
    const topPad = 96, sidePad = 16, bottomPad = 24;
    const availW = W - sidePad*2;
    const availH = H - topPad - bottomPad;
    cell = Math.floor(Math.min(availW, availH) / N);
    cell = clamp(cell, 24, 72);
    const boardSize = cell*N;
    boardX = (W-boardSize)/2;
    boardY = topPad + Math.max(0, (availH-boardSize)/2);
  }
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    layout();
  }
  window.addEventListener('resize', resize);

  function cellRect(col,row){ return { x: boardX+col*cell, y: boardY+row*cell, w:cell, h:cell }; }
  function cellCenter(col,row){ return { x: boardX+col*cell+cell/2, y: boardY+row*cell+cell/2 }; }
  function cellFromPoint(x,y){
    const col = Math.floor((x-boardX)/cell);
    const row = Math.floor((y-boardY)/cell);
    if(col<0||col>=N||row<0||row>=N) return null;
    return { col, row };
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---- idle motion: breathing pulse per-element, EXCEPT lightning which
  // snap-flickers instead (GAME_7_PILLARS.md §5's named exception) ----
  // Player feedback after ship: lightning read as "overstimulating" — the
  // original version re-rolled every 70-200ms PER CELL between two very
  // different scale states (0.88/1.08, a 20% size swing), and with roughly
  // a quarter of an 8x8 board being lightning at tier 4, that's dozens of
  // independent strobes per second across the board. Real lightning is
  // mostly calm with an occasional flash, not a constant flicker — rebuilt
  // around that read: a neutral resting scale (matching every other
  // element's baseline instead of sitting dimmed), a much slower re-roll
  // (0.55-1.5s vs 70-200ms), and a low per-roll chance of the brief bright
  // snap (18% vs the old 65%). Still a "snap," not a smooth pulse — the
  // named exception still holds, it's just rare and calm instead of
  // constant and jarring.
  const PULSE_SPEED = { fire:2.6, frost:1.1, verdant:1.5, void:1.3, light:1.8 };
  const flickerState = new Map(); // "c,r" -> {next, on}
  function idleFactor(type, col, row, now){
    if(type === 'lightning'){
      const key = col+','+row;
      let f = flickerState.get(key);
      if(!f || now >= f.next){
        f = { on: Math.random() > 0.82, next: now + 550 + Math.random()*950 };
        flickerState.set(key, f);
      }
      return f.on ? 1.06 : 1.0;
    }
    const speed = PULSE_SPEED[type] || 1.4;
    const phase = (col*0.7 + row*1.3);
    return 1 + Math.sin(now/1000*speed + phase)*0.055;
  }

  function drawTile(tile, x, y, w, h, isSelected, now){
    if(!tile) return;
    const cx = x+w/2, cy = y+h/2;
    ctx.save();
    ctx.translate(cx, cy);
    const pulse = idleFactor(tile.bomb ? 'bomb' : tile.type, Math.round(x/w), Math.round(y/h), now);
    if(tile.bomb){
      const sprite = bombSpriteFor(tile.bomb, tile.type);
      const scale = (w*0.92)/SPRITE_SIZE;
      if(tile.bomb === 'line'){
        const rot = tile.axis === 'row' ? 0 : Math.PI/2;
        ctx.rotate(rot + now/1000*0.6); // idle-rotate, "primed" per §5
      } else {
        ctx.rotate(now/1000*0.35); // rune-circle slow rotation
        // orbiting satellite shards, drawn live (not baked) so they orbit
        const accent = TILE_COLORS[tile.type] || '#ffcb5c';
        for(let i=0;i<3;i++){
          const ang = now/700 + i*(Math.PI*2/3);
          const orx = Math.cos(ang)*w*0.44, ory = Math.sin(ang)*w*0.44;
          ctx.fillStyle = shadeHex(accent, 10, 5);
          ctx.beginPath(); ctx.arc(orx, ory, Math.max(1.5,w*0.045), 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.scale(scale, scale);
      ctx.drawImage(sprite, -SPRITE_SIZE/2, -SPRITE_SIZE/2);
    } else {
      const sprite = ELEMENT_SPRITES[tile.type];
      if(sprite){
        ctx.scale(pulse, pulse);
        ctx.globalAlpha = 1;
        const scale = (w*0.86)/SPRITE_SIZE;
        ctx.scale(scale, scale);
        ctx.drawImage(sprite, -SPRITE_SIZE/2, -SPRITE_SIZE/2);
      }
    }
    ctx.restore();
    if(isSelected){
      ctx.save();
      roundedRect(x+2, y+2, w-4, h-4, Math.min(w,h)*0.22);
      ctx.lineWidth = Math.max(2, w*0.06);
      ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--neon') || '#ffcb5c';
      ctx.stroke();
      ctx.restore();
    }
  }

  // ---- particles: shatter-shards (plain clears), ring shockwave
  // (area-bomb, ported verbatim from wardfall.html:1506-1516 per §5's own
  // "reuse it rather than reinvent it"), linear sweep (line-bomb), and a
  // mana-drain ctx.clip() reveal wipe (bomb creation) ----
  let shards = [], rings = [], sweeps = [], reveals = [];
  let pending = []; // {fireAt, run}

  // player feedback after ship: "can it have the animation of the gems
  // moving" — until now the board only ever drew Board.at()'s live state
  // straight through, so a swap and every gravity/refill drop snapped
  // instantly with zero motion (only the clear/bomb PARTICLE effects
  // above were ever animated). Two real, data-driven animations added:
  // a swap-slide (the two tiles a player actually swapped trade screen
  // positions) and a fall (gravity/refill playing back the real per-
  // column movement Board now records in its timeline, not a guessed
  // before/after diff). Both follow the same "state resolves instantly,
  // playback catches up" split as the particle system.
  const SWAP_SLIDE_DURATION = 140, FALL_DURATION = 220;
  let swapAnim = null; // { a:{col,row}, b:{col,row}, tileA, tileB, start, dur }
  const fallAnims = new Map(); // "col,row" (FINAL cell) -> { fromRow, toRow, start, dur }

  // bug-squasher finding: pausing never actually froze any of this — the
  // only screen gate was `Nav.currentScreen() !== 'game'`, which stays
  // true while paused (the pause overlay is a DOM layer on top, not a
  // screen change), so a cascade queued right before pausing kept playing
  // out in full using real wall-clock time behind the opaque overlay and
  // was already finished by the time the player hit Resume — the exact
  // opposite of this module's own stated intent. `effectiveNow()` is real
  // time minus total time spent paused (frozen at the instant it started
  // if currently paused), and every animation timestamp below is measured
  // against it instead of raw performance.now() so paused time genuinely
  // doesn't count.
  let pauseOffsetMs = 0, pauseStartedAt = null;
  function effectiveNow(){
    const raw = performance.now();
    return (pauseStartedAt !== null ? pauseStartedAt : raw) - pauseOffsetMs;
  }
  function updatePauseClock(){
    const isPaused = Game.isRunning() && Game.isPaused();
    if(isPaused && pauseStartedAt === null){ pauseStartedAt = performance.now(); }
    else if(!isPaused && pauseStartedAt !== null){ pauseOffsetMs += performance.now()-pauseStartedAt; pauseStartedAt = null; }
    return isPaused;
  }

  Events.on('swap:visual', (e) => {
    swapAnim = { a:e.a, b:e.b, tileA:e.tileA, tileB:e.tileB, start:effectiveNow(), dur:SWAP_SLIDE_DURATION };
  });

  // qa-playtest finding: frame() bails out early whenever the screen isn't
  // 'game' (below), which freezes `pending`'s real-time drain but NOT wall
  // clock time — so a chain queued right as a run ended (Levels' final
  // move, a mid-chain quit-to-menu) sat frozen past its fireAt, then fired
  // as one batch of stale rings/sweeps/reveals on the very first frame of
  // the NEXT run. Reset on every return to the 'game' screen (fresh start,
  // Play Again, or a different mode) — never on pause/resume, which
  // doesn't fire nav:change and SHOULD let a mid-chain animation resume
  // where it left off.
  function resetParticles(){ shards = []; rings = []; sweeps = []; reveals = []; pending = []; swapAnim = null; fallAnims.clear(); pauseOffsetMs = 0; pauseStartedAt = null; }
  Events.on('nav:change', (e) => { if(e.to === 'game') resetParticles(); });

  function spawnShardBurst(cells, axis, elementType){
    const color = TILE_COLORS[elementType] || '#fff';
    const along = axis === 'row' ? {x:1,y:0} : {x:0,y:1};
    for(const c of cells){
      const p = cellCenter(c.col, c.row);
      for(let i=0;i<4;i++){
        const dir = i%2===0 ? 1 : -1;
        const jitter = (Math.random()-0.5)*0.6;
        shards.push({
          x:p.x, y:p.y,
          vx: along.x*dir*(90+Math.random()*60) + along.y*jitter*40,
          vy: along.y*dir*(90+Math.random()*60) + along.x*jitter*40,
          rot: Math.random()*Math.PI*2, vrot:(Math.random()-0.5)*10,
          life:0, maxLife:0.38+Math.random()*0.1, color, size: cell*0.14,
        });
      }
    }
  }
  function spawnAreaDetonation(col,row,elementType){
    const p = cellCenter(col,row);
    rings.push({ x:p.x, y:p.y, t:0, dur:0.42, color: TILE_COLORS[elementType]||'#fff' });
    reveals.push({ x:p.x, y:p.y, t:0, dur:0.5, kind:'conic', color: TILE_COLORS[elementType]||'#fff' });
  }
  function spawnLineDetonation(col,row,axis,elementType){
    const p = cellCenter(col,row);
    const x1 = axis==='row' ? boardX : p.x, y1 = axis==='row' ? p.y : boardY;
    const x2 = axis==='row' ? boardX+cell*N : p.x, y2 = axis==='row' ? p.y : boardY+cell*N;
    sweeps.push({ x1,y1,x2,y2, axis, t:0, dur:0.3, color: TILE_COLORS[elementType]||'#fff' });
  }
  function spawnFlashPrime(col,row){
    reveals.push({ x:cellCenter(col,row).x, y:cellCenter(col,row).y, t:0, dur:0.16, kind:'flash', color:'#ffffff' });
  }
  function spawnCreateReveal(col,row,elementType){
    const p = cellCenter(col,row);
    reveals.push({ x:p.x, y:p.y, t:0, dur:0.4, kind:'clip', color: TILE_COLORS[elementType]||'#fff' });
  }
  function spawnFall(col,fromRow,toRow){
    // bug-squasher finding: a multi-pass cascade landing twice in the same
    // final cell (common — any refill-triggered secondary match in the
    // same column) overwrote this Map entry while the PRIOR fall was still
    // mid-flight, snapping the tile backward to the new raw fromRow instead
    // of continuing from wherever it actually was on screen. Fixed by
    // reading the in-flight animation's own CURRENT interpolated position
    // and starting the new segment from there, so back-to-back falls in
    // the same cell read as one continuous drop instead of a jump.
    const key = col+','+toRow;
    const existing = fallAnims.get(key);
    if(existing){
      const p = clamp((effectiveNow()-existing.start)/existing.dur, 0, 1);
      if(p < 1){
        const eased = 1-Math.pow(1-p,3);
        fromRow = existing.fromRow + (existing.toRow-existing.fromRow)*eased;
      }
    }
    fallAnims.set(key, { fromRow, toRow, start: effectiveNow(), dur: FALL_DURATION });
  }

  function schedule(delayMs, fn){ pending.push({ fireAt: effectiveNow()+delayMs, run: fn }); }

  // Board's timeline (GAME_7_PILLARS.md §7's "state resolves instantly,
  // playback catches up" split) drives all of the above, staggered by
  // pass + chainOrder rather than played back all at once. Every pass is
  // additionally offset by SWAP_SLIDE_DURATION — a valid swap ALWAYS
  // creates an immediate match (Board.trySwap requires it), so pass 1's
  // effects would otherwise start firing at the exact cells the swap-slide
  // is still animating into; letting the slide finish first, then playing
  // the cascade, reads as one continuous motion instead of two competing
  // ones landing on top of each other.
  Events.on('board:resolved', (e) => {
    const stats = e.stats;
    if(!stats || !stats.timeline) return;
    for(const ev of stats.timeline){
      const passDelay = SWAP_SLIDE_DURATION + (ev.pass-1)*150;
      if(ev.type === 'clear'){
        schedule(passDelay, () => spawnShardBurst(ev.cells, ev.axis, ev.elementType));
      } else if(ev.type === 'bombCreate'){
        schedule(passDelay, () => spawnCreateReveal(ev.col, ev.row, ev.elementType));
      } else if(ev.type === 'bombDetonate'){
        const chainDelay = passDelay + ev.chainOrder*100;
        schedule(Math.max(0,chainDelay-90), () => spawnFlashPrime(ev.col, ev.row));
        schedule(chainDelay, () => {
          if(ev.kind === 'area') spawnAreaDetonation(ev.col, ev.row, ev.elementType);
          else spawnLineDetonation(ev.col, ev.row, ev.axis, ev.elementType);
        });
      } else if(ev.type === 'fall'){
        schedule(passDelay, () => spawnFall(ev.col, ev.fromRow, ev.toRow));
      }
    }
  });

  function updateParticles(dt){
    const now = effectiveNow();
    for(let i=pending.length-1;i>=0;i--){ if(now >= pending[i].fireAt){ pending[i].run(); pending.splice(i,1); } }
    for(const s of shards){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=0.94; s.vy*=0.94; s.rot+=s.vrot*dt; s.life+=dt; }
    shards = shards.filter(s => s.life < s.maxLife);
    for(const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < r.dur);
    for(const s of sweeps) s.t += dt;
    sweeps = sweeps.filter(s => s.t < s.dur);
    for(const r of reveals) r.t += dt;
    reveals = reveals.filter(r => r.t < r.dur);
  }

  function drawParticles(){
    for(const s of shards){
      const t = s.life/s.maxLife;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.max(0, 1-t);
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.fillStyle = shadeHex(s.color, 30, 10);
      ctx.beginPath(); ctx.moveTo(0,-s.size); ctx.lineTo(s.size*0.6,s.size*0.5); ctx.lineTo(-s.size*0.6,s.size*0.5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    // ring shockwave — ported verbatim from wardfall.html:1506-1516
    for(const s of rings){
      const t = s.t/s.dur;
      const r = (t*t*(3-2*t)) * cell*2.6; // smoothstep, close to Ease.easeOutCubic's feel
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1-t);
      ctx.strokeStyle = s.color; ctx.lineWidth = 4*(1-t)+1;
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = `rgba(22,16,34,${0.5*(1-t)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, r*0.55, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    for(const s of sweeps){
      const t = s.t/s.dur;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.max(0, 1-t)*0.9;
      ctx.strokeStyle = s.color; ctx.lineWidth = cell*0.5*(1-t*0.6);
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
      ctx.restore();
    }
    for(const r of reveals){
      const t = r.t/r.dur;
      ctx.save();
      if(r.kind === 'clip'){
        // mana-drain reveal wipe — ctx.clip() on a growing circle, zero
        // uses anywhere in this portfolio before this pass. A bright ring
        // sits right at the clip edge so the wipe itself is visible.
        const rad = t*cell*0.8;
        ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI*2); ctx.clip();
        ctx.fillStyle = shadeHex(r.color, 40, 20);
        ctx.globalAlpha = Math.max(0,1-t)*0.6;
        ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI*2); ctx.fill();
        ctx.restore(); ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2*(1-t);
        ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI*2); ctx.stroke();
      } else if(r.kind === 'conic'){
        // area-bomb "mana surge" sweep — createConicGradient() used
        // INSIDE real gameplay for the first time in this portfolio
        // (previously portal/menu chrome only, GAME_7_PILLARS.md §5).
        const grad = ctx.createConicGradient(t*Math.PI*2, r.x, r.y);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.08, shadeHex(r.color, 40, 15));
        grad.addColorStop(0.16, 'rgba(255,255,255,0)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.max(0,1-t);
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(r.x, r.y, cell*2.4, 0, Math.PI*2); ctx.fill();
      } else { // flash-prime — brief bright pulse right before a chained
               // bomb detonates, per §5's "flash-primes for one beat"
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.max(0,1-t*1.4);
        ctx.fillStyle = r.color;
        ctx.beginPath(); ctx.arc(r.x, r.y, cell*0.5*(0.6+t), 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }

  let lastFrameNow = 0;
  function frame(){
    const raw = performance.now();
    const dt = lastFrameNow ? Math.min(0.05,(raw-lastFrameNow)/1000) : 0;
    lastFrameNow = raw;
    ctx.clearRect(0,0,W,H);
    if(Nav.currentScreen() !== 'game') return;
    // bug-squasher finding: pausing never froze any of this — the only
    // screen gate above stays true while paused (the pause menu is a DOM
    // overlay, not a screen change), so a cascade queued right before
    // pausing kept playing on real wall-clock time behind it and was
    // already finished by the time the player resumed. `now` below is the
    // pause-aware clock every animation timestamp is measured against;
    // `updateParticles` (which advances shard/ring/sweep/reveal timers AND
    // drains the `pending` schedule) is skipped entirely while paused so
    // NOTHING in the queue can progress, while `drawParticles` still runs
    // so whatever was already on screen stays visibly frozen in place
    // rather than vanishing.
    const paused = updatePauseClock();
    const now = effectiveNow();
    ctx.fillStyle = boardPattern;
    ctx.fillRect(boardX, boardY, cell*N, cell*N);
    const selected = Game.getSelected();
    const swapActive = swapAnim && (now - swapAnim.start < swapAnim.dur);
    if(swapAnim && !swapActive) swapAnim = null;
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      // the two cells a real swap is actively animating between are drawn
      // separately below (interpolated position, snapshot tile) instead
      // of here — Board's live state at these cells may already reflect
      // the post-cascade result, which isn't what should be sliding.
      if(swapActive && ((c===swapAnim.a.col&&r===swapAnim.a.row) || (c===swapAnim.b.col&&r===swapAnim.b.row))) continue;
      const t = Board.at(c,r);
      const rect = cellRect(c,r);
      const isSel = selected && selected.col===c && selected.row===r;
      const fall = fallAnims.get(c+','+r);
      let drawY = rect.y;
      if(fall){
        if(now - fall.start < fall.dur){
          const p = clamp((now-fall.start)/fall.dur, 0, 1);
          const eased = 1-Math.pow(1-p,3); // ease-out — snappy arrival, not a linear drop
          const visualRow = fall.fromRow + (fall.toRow-fall.fromRow)*eased;
          drawY = boardY + visualRow*cell;
        } else {
          fallAnims.delete(c+','+r);
        }
      }
      drawTile(t, rect.x, drawY, rect.w, rect.h, isSel, now);
    }
    if(swapActive){
      const p = clamp((now-swapAnim.start)/swapAnim.dur, 0, 1);
      const eased = 1-Math.pow(1-p,3);
      const posA = cellRect(swapAnim.a.col,swapAnim.a.row), posB = cellRect(swapAnim.b.col,swapAnim.b.row);
      drawTile(swapAnim.tileA, posA.x+(posB.x-posA.x)*eased, posA.y+(posB.y-posA.y)*eased, cell, cell, false, now);
      drawTile(swapAnim.tileB, posB.x+(posA.x-posB.x)*eased, posB.y+(posA.y-posB.y)*eased, cell, cell, false, now);
    }
    if(!paused) updateParticles(dt);
    drawParticles();
  }

  // ---- input: tap-to-select, tap-adjacent-to-swap ----
  let dragStart = null;
  canvas.addEventListener('pointerdown', (e) => {
    if(Nav.currentScreen() !== 'game' || Game.isPaused() || !Game.isRunning()) return;
    const cell0 = cellFromPoint(e.clientX, e.clientY);
    if(!cell0) return;
    dragStart = { cell: cell0, x:e.clientX, y:e.clientY };
  });
  canvas.addEventListener('pointerup', (e) => {
    if(!dragStart) return;
    const start = dragStart; dragStart = null;
    if(Nav.currentScreen() !== 'game' || Game.isPaused() || !Game.isRunning()) return;
    const dx = e.clientX-start.x, dy = e.clientY-start.y;
    const dist = Math.hypot(dx,dy);
    if(dist > cell*0.35){
      // drag-swap: pick the neighbor in the dominant drag direction
      let target;
      if(Math.abs(dx) > Math.abs(dy)) target = { col: start.cell.col + (dx>0?1:-1), row: start.cell.row };
      else target = { col: start.cell.col, row: start.cell.row + (dy>0?1:-1) };
      Game.handlePointerCell(start.cell);
      Game.handlePointerCell(target);
    } else {
      Game.handlePointerCell(start.cell);
    }
  });

  resize();
  return { frame, resize, _test: { cellFromPoint, cellRect, layoutInfo: () => ({ boardX, boardY, cell }),
    particleCounts: () => ({ shards: shards.length, rings: rings.length, sweeps: sweeps.length, reveals: reveals.length, pending: pending.length }),
    fallAnimsSnapshot: () => Array.from(fallAnims.entries()).map(([k,v]) => ({ key:k, ...v })) } };
})();

renderModeSelectScoresOnLoad();
function renderModeSelectScoresOnLoad(){ Game.renderModeSelectScores(); }

/* =====================================================================
   BUGREP — copied verbatim from infall.html's own Bugrep module (this
   studio's proven, shipped pattern) per the bug-report-widget skill's own
   "don't rewrite the functions per project" rule. Only the storage key
   and exported document id changed (runeshatter_v1), and open() pauses
   through Game's real API instead of infall's Game.state check.
===================================================================== */
const Bugrep = (function(){
  const KEY = 'bugreports-runeshatter_v1';
  let selCat = 'Bug';
  function loadAll(){
    try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ return []; }
  }
  function store(l){ try{ localStorage.setItem(KEY, JSON.stringify(l)); }catch(e){} }
  function badge(){
    const l = loadAll();
    const b = document.getElementById('bugBadge');
    b.style.display = l.length ? 'flex' : 'none';
    b.textContent = l.length;
  }
  // qa-playtest finding: opening mid-run silently paused the game (the
  // real pause overlay sits underneath this one, same z-index, later in
  // DOM order so it's hidden but still active) and closing never resumed
  // it — a player who never asked to pause landed on the pause menu after
  // just filing a report. pausedByThis tracks whether OPEN was the one
  // that paused, so CLOSE only un-pauses what it itself paused.
  let pausedByThis = false;
  function open(){
    pausedByThis = Game.isRunning() && !Game.isPaused();
    if(pausedByThis) Game.togglePause();
    renderList();
    document.getElementById('bugOverlay').classList.add('show');
  }
  function close(){
    document.getElementById('bugOverlay').classList.remove('show');
    if(pausedByThis && Game.isRunning() && Game.isPaused()) Game.togglePause();
    pausedByThis = false;
  }
  function cat(btn){
    document.querySelectorAll('.bugcat .btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    selCat = btn.dataset.cat;
  }
  function save(){
    const title = document.getElementById('bugTitle').value.trim();
    const details = document.getElementById('bugDetails').value.trim();
    if(!title && !details){ alert('Add a title or details first.'); return; }
    const l = loadAll();
    l.push({ category:selCat, title:title||'(no title)', details, document:'runeshatter_v1', timestamp:new Date().toISOString() });
    store(l);
    document.getElementById('bugTitle').value = '';
    document.getElementById('bugDetails').value = '';
    renderList(); badge();
  }
  function renderList(){
    const l = loadAll();
    document.getElementById('bugList').innerHTML = l.map((r,i) => `
      <div class="bug-item"><span class="del" onclick="Bugrep.del(${i})">remove</span>
        <div class="cat">${escapeHtml(r.category)}</div><strong>${escapeHtml(r.title)}</strong>
        ${r.details ? `<div style="opacity:.75;margin-top:2px;">${escapeHtml(r.details)}</div>` : ''}
      </div>`).join('');
    document.getElementById('bugExportBtn').style.display = l.length ? 'block' : 'none';
  }
  function del(i){ const l = loadAll(); l.splice(i,1); store(l); renderList(); badge(); }
  function exportAll(){
    const l = loadAll();
    if(!l.length) return;
    const blob = new Blob([JSON.stringify({exportedFrom:'runeshatter_v1', exportedAt:new Date().toISOString(), reports:l}, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bugreports_runeshatter_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }
  badge();
  return { open, close, cat, save, del, exportAll };
})();

requestAnimationFrame((ts) => { Game.tick(ts); });
</script>
