<style>
:root{
  --bg:#140b30;
  --panel:#231442;
  --panel2:#301c58;
  --ink:#f4ecff;
  --ink-mid:#c2b3e8;
  --ink-soft:#8674b8;
  --neon:#ffcb5c;
  --neon2:#b98aff;
  --gold:#ffd76b;
  --danger:#ff4d70;
  --ok:#5eff9c;
  --border:rgba(255,203,92,0.25);
  --mono:'IBM Plex Mono','Courier New',monospace;
  --display:'Cormorant Garamond',Georgia,serif;
  --body-font:'Quicksand',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--body-font);user-select:none;-webkit-user-select:none;}

#gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none;}

/* ---- HUD (mirrors wardfall.html's #hud shape) ---- */
#hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;display:none;
  align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:10;
  font-family:var(--mono);}
#hud.show{display:flex;}
.hud-left{display:flex;flex-direction:column;gap:2px;}
#scoreVal{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.03em;}
#tierVal{font-size:11px;color:var(--neon);letter-spacing:.06em;text-transform:uppercase;min-height:14px;}
.hud-right{text-align:right;display:flex;flex-direction:column;gap:2px;}
#budgetVal{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.05em;}
#budgetLabel{font-size:11px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;}
#objectiveVal{position:fixed;top:66px;left:0;right:0;text-align:center;font-family:var(--mono);
  font-size:11px;color:var(--ink-mid);pointer-events:none;z-index:10;display:none;}
#objectiveVal.show{display:block;}
.hud-pause-btn{position:fixed;top:14px;right:14px;z-index:20;pointer-events:auto;
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--panel);
  color:var(--ink-soft);font-size:14px;cursor:pointer;display:none;align-items:center;justify-content:center;}
.hud-pause-btn.show{display:flex;}
.hud-pause-btn:hover{color:var(--neon);border-color:var(--neon);}

/* ---- overlay/panel/btn — copied verbatim from wardfall.html's own tokens/shapes ---- */
.overlay{position:fixed;inset:0;background:rgba(5,6,12,0.86);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;overflow-y:auto;}
.overlay.show{display:flex;animation:ovfade .2s ease;}
@keyframes ovfade{from{opacity:0;}to{opacity:1;}}
@keyframes panelPop{0%{opacity:0;transform:scale(.92) translateY(6px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.overlay .panel{animation:panelPop .38s cubic-bezier(.2,.9,.3,1.3) both;}
body.reduced-motion .overlay.show,
body.reduced-motion .panel{animation:none!important;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:26px 24px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto;
  box-shadow:0 0 60px -18px rgba(226,184,85,0.22);margin:auto;}
.panel h1{font-size:2rem;letter-spacing:.18em;text-align:center;color:var(--neon);
  text-shadow:0 0 26px rgba(255,203,92,0.55);margin-bottom:4px;font-family:var(--display);font-weight:600;}
.panel h2{font-size:1.2rem;letter-spacing:.1em;color:var(--neon);text-align:center;margin-bottom:16px;font-family:var(--display);font-weight:600;}
.tagline{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-bottom:18px;font-family:var(--display);font-style:italic;}
.stat-line{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.85rem;
  color:var(--ink-mid);padding:6px 0;border-bottom:1px solid var(--border);}
.stat-line b{color:var(--neon);font-weight:600;}
.new-best{text-align:center;font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;
  color:var(--gold);margin:6px 0 4px;text-transform:uppercase;}
.btn{display:block;width:100%;padding:.85rem;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--ink);font-size:.95rem;font-weight:600;cursor:pointer;
  margin-bottom:10px;transition:all .15s;font-family:inherit;letter-spacing:.04em;}
.btn:hover{border-color:var(--neon);color:var(--neon);box-shadow:0 0 18px -6px var(--neon);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none;}

/* ---- mode-select cards ---- */
.mode-card{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel2);color:var(--ink);cursor:pointer;margin-bottom:12px;text-align:left;
  font-family:inherit;transition:all .15s;}
.mode-card:hover{border-color:var(--neon);box-shadow:0 0 18px -6px var(--neon);}
.mode-card .mode-name{font-family:var(--display);font-size:1.15rem;color:var(--neon);letter-spacing:.05em;font-weight:600;}
.mode-card .mode-desc{font-size:.72rem;color:var(--ink-soft);margin-top:2px;}
.mode-card .mode-best{font-family:var(--mono);font-size:.72rem;color:var(--ink-mid);margin-top:6px;}

/* ---- level select grid ---- */
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;}
.level-tile{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink-mid);gap:2px;}
.level-tile .level-star{font-size:.65rem;}
.level-tile.locked{opacity:.32;cursor:default;}
.level-tile.completed{border-color:var(--ok);color:var(--ok);box-shadow:0 0 10px -4px var(--ok);}
.level-tile.current-unlocked{border-color:var(--neon);color:var(--neon);}

/* ---- meta row / version marker ---- */
.meta-row{position:fixed;bottom:8px;right:10px;display:flex;align-items:center;gap:6px;z-index:60;}
.version-marker{font-family:var(--mono);font-size:10px;color:var(--ink-soft);opacity:.6;
  letter-spacing:.02em;pointer-events:none;}
/* ---- icon-btn — copied verbatim from wardfall.html/sigilchain.html's own
   token (same size/shape/hover), so the mute control matches this studio's
   real existing pattern rather than inventing a new one for this game. ---- */
.icon-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
  background:var(--panel);color:var(--ink-soft);font-size:12px;cursor:pointer;opacity:.7;
  display:flex;align-items:center;justify-content:center;position:relative;}
.icon-btn:hover{opacity:1;color:var(--neon);border-color:var(--neon);}

/* ---- bug reporter — copied verbatim from infall.html's own Bugrep
   widget/CSS (studio's own proven pattern, not the generic skill's raw
   default palette) so it matches this game's real tokens automatically. */
.bugrep-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;
  font-size:9px;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;}
.bugrep-badge:empty,.bugrep-badge[data-zero]{display:none;}
.bugcat{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.bugcat .btn{width:auto;flex:1;padding:.5rem;font-size:.78rem;margin-bottom:0;}
.bugcat .btn.sel{border-color:var(--neon2);color:var(--neon2);}
.form-input{width:100%;padding:.7rem;border-radius:8px;border:1px solid var(--border);
  background:var(--panel2);color:var(--ink);font-family:inherit;font-size:.85rem;margin-bottom:10px;}
textarea.form-input{min-height:70px;resize:vertical;}
.bug-item{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  margin-bottom:8px;font-size:.8rem;position:relative;}
.bug-item .del{position:absolute;top:6px;right:8px;color:var(--danger);font-size:.7rem;cursor:pointer;opacity:.7;}
.bug-item .cat{font-family:var(--mono);font-size:.65rem;color:var(--neon2);text-transform:uppercase;margin-bottom:2px;}

@media (max-width:480px){
  .panel{padding:20px 18px;}
  .level-grid{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<button class="hud-pause-btn" id="pauseBtn" onclick="Music.uiClick();Game.togglePause()" aria-label="Pause">❚❚</button>
<div id="hud">
  <div class="hud-left">
    <div id="scoreVal">0</div>
    <div id="tierVal"></div>
  </div>
  <div class="hud-right">
    <div id="budgetVal">—</div>
    <div id="budgetLabel">Moves</div>
  </div>
</div>
<div id="objectiveVal"></div>

<!-- MODE SELECT -->
<div class="overlay show" id="modeSelectScreen">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Runeshatter mode select">
    <h1>RUNESHATTER</h1>
    <div class="tagline">shatter the cluster, chain the blast</div>
    <button class="btn" id="resumeBtn" style="display:none;" onclick="Music.uiClick(262,0.09);Game.resumeSession()">▶ RESUME SAVED RUN</button>
    <button class="mode-card" onclick="Music.uiClick(262,0.09);Game.startEndless()" aria-label="Endless mode">
      <div class="mode-name">ENDLESS</div>
      <div class="mode-desc">no limit — chase the highest score you can before the board turns hostile</div>
      <div class="mode-best">Best score <b id="bestEndless">0</b></div>
    </button>
    <button class="mode-card" onclick="Music.uiClick();Nav.goTo('levelSelect')" aria-label="Levels mode">
      <div class="mode-name">LEVELS</div>
      <div class="mode-desc">20 hand-authored boards, tightening move budgets, rising tile tiers</div>
      <div class="mode-best">Furthest level reached <b id="bestLevels">0</b></div>
    </button>
    <button class="mode-card" onclick="Music.uiClick(262,0.09);Game.startTimed()" aria-label="Timed Survival mode">
      <div class="mode-name">TIMED SURVIVAL</div>
      <div class="mode-desc">a running clock, an escalating board — survive it</div>
      <div class="mode-best">Best score <b id="bestTimed">0</b></div>
    </button>
    <a class="btn" href="index.html" style="text-align:center;text-decoration:none;" aria-label="Back to the arcade">← Back to the Arcade</a>
  </div>
</div>

<!-- LEVEL SELECT -->
<div class="overlay" id="levelSelectScreen">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Level select">
    <h2>✦ LEVEL SELECT ✦</h2>
    <div class="tagline">unlock the next by completing the last</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn" onclick="Music.uiClick(165,0.08);Nav.goTo('modeSelect')" aria-label="Back">BACK</button>
  </div>
</div>

<!-- PAUSE -->
<div class="overlay" id="pauseOverlay">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Paused">
    <h2>PAUSED</h2>
    <button class="btn" onclick="Music.uiClick(262,0.09);Game.togglePause()" aria-label="Resume">RESUME</button>
    <button class="btn" onclick="Music.uiClick(165,0.08);Game.endRunFromPause()" aria-label="End run">END RUN</button>
    <button class="btn" onclick="Music.uiClick(165,0.08);Game.quitToMenu()" aria-label="Quit to menu">QUIT TO MENU</button>
  </div>
</div>

<!-- RESULTS -->
<div class="overlay" id="resultsScreen">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Run results">
    <h2 id="resultsTitle">RUN ENDED</h2>
    <div class="new-best" id="resultsNewBest" style="display:none;">✦ NEW HIGH SCORE ✦</div>
    <div class="stat-line">Mode <b id="resultsMode">—</b></div>
    <div class="stat-line">Score <b id="resultsScore">0</b></div>
    <div class="stat-line" id="resultsLevelRow" style="display:none;">Level <b id="resultsLevel">—</b></div>
    <div class="stat-line" id="resultsOutcomeRow" style="display:none;">Outcome <b id="resultsOutcome">—</b></div>
    <button class="btn" onclick="Music.uiClick(262,0.1);Game.playAgain()" aria-label="Play again">PLAY AGAIN</button>
    <button class="btn" onclick="Music.uiClick();Nav.goTo('modeSelect')" aria-label="Back to mode select">MODE SELECT</button>
  </div>
</div>

<!-- BUG REPORTER — copied verbatim from infall.html's own Bugrep widget
     markup (this studio's proven pattern) -->
<div class="overlay" id="bugOverlay">
  <div class="panel" role="dialog" aria-modal="true" aria-label="Report an issue">
    <h2>REPORT ISSUE</h2>
    <div class="bugcat">
      <button class="btn sel" data-cat="Bug" onclick="Music.uiClick(220,0.06);Bugrep.cat(this)">🐛 Bug</button>
      <button class="btn" data-cat="Balance" onclick="Music.uiClick(220,0.06);Bugrep.cat(this)">⚖ Balance</button>
      <button class="btn" data-cat="Suggestion" onclick="Music.uiClick(220,0.06);Bugrep.cat(this)">💡 Idea</button>
      <button class="btn" data-cat="Other" onclick="Music.uiClick(220,0.06);Bugrep.cat(this)">… Other</button>
    </div>
    <input class="form-input" id="bugTitle" placeholder="Short title">
    <textarea class="form-input" id="bugDetails" placeholder="What happened?"></textarea>
    <button class="btn primary" onclick="Music.uiClick(262,0.1);Bugrep.save()">SAVE REPORT</button>
    <div id="bugList"></div>
    <button class="btn" onclick="Music.uiClick();Bugrep.exportAll()" id="bugExportBtn">⬇ EXPORT REPORTS</button>
    <button class="btn" onclick="Music.uiClick(165,0.08);Bugrep.close()">CLOSE</button>
  </div>
</div>

<div class="meta-row">
  <button class="icon-btn" onclick="this.textContent = Music.toggleMute() ? '🔇' : '🔊'; Music.uiClick()" title="Mute" aria-label="Mute">🔊</button>
  <button class="icon-btn" onclick="Music.uiClick();Bugrep.open()" title="Report an issue" aria-label="Report an issue">⚑<span class="bugrep-badge" id="bugBadge">0</span></button>
  <div class="version-marker" id="versionMarker">RUNESHATTER v0.6.2</div>
</div>

<script>
'use strict';
/* =====================================================================
   RUNESHATTER — CHANGE LOG
   (one line per change, most recent on top)

   v0.6.2 — 2026-08-05 — UI click sound, closing this game's share of the
                          studio-wide "zero UI sound anywhere" gap
                          (game-audio-production-suite skill, Part B —
                          confirmed zero across all 6 games, every
                          .btn/menu/settings/pause onclick called a state/
                          logic function directly with no accompanying
                          audio). Added Music.uiClick(freq, dur) next to
                          bell() (:1559+) — deliberately NOT a new synthesis
                          voice, it's bell() itself called with defaults
                          tuned quieter/shorter/lower than every existing
                          bell()-based cue (220Hz/vol 0.09/~80ms, vs.
                          plainMatchClink's 480-648Hz/vol 0.11/260ms and
                          tierUpFanfare's 220Hz+/vol 0.16+), routed through
                          the same sfxGain->master bus via bell()'s own
                          wiring. Unlike every other SFX function here it
                          also calls ensureCtx() itself — a menu click is
                          often the player's first real gesture on the
                          page, before any mode-card would otherwise start
                          the AudioContext — so this doubles as an earlier,
                          equally-valid audio-start gesture, not a bypass
                          of the user-gesture requirement. Wired into all
                          20 real static controls: the HUD pause icon,
                          mode-select's 3 mode cards + Resume Saved Run,
                          level-select's Back, the pause overlay's 3
                          buttons, results' Play Again/Mode Select, the bug
                          reporter's 4 category toggles + Save/Export/
                          Close, and the mute + report-issue icon buttons
                          (mute plays the click AFTER Music.toggleMute() so
                          muting itself stays silent and only unmuting
                          audibly confirms). Left unwired: the "Back to the
                          Arcade" link (navigates away immediately — no
                          time for a one-shot to render before unload) and
                          the dynamically-rendered per-row bug-report
                          "remove" link (minor dev-tool action, not in the
                          same class as the rest). No runeshatter-sw.js
                          exists for this game (unlike Games 1-4, it isn't
                          precached by any service worker — confirmed by
                          grep, portal-sw.js doesn't reference
                          runeshatter.html either) so no CACHE_NAME bump
                          applies here. Verified live via Playwright:
                          clicking each wired control schedules real
                          connected oscillator/gain nodes on sfxGain, and
                          Music._test.uiClickCount() increments once per
                          click; 53/53 adversarial + 41/41 audio tests
                          still passing.

   v0.6.1 — 2026-08-03 — Three bugs fixed, found by a dedicated bug-squasher
                          (qa-playtest) pass specifically targeting v0.6.0's
                          new animation/audio code, none reachable through
                          the existing automated suites:
                          (1) Multi-pass cascade fall "snap-and-restart" —
                          real, reproducible from a single ordinary swap
                          whenever a cascade lands twice in the same final
                          cell (common: any refill-triggered secondary match
                          in the same column). spawnFall() was overwriting
                          fallAnims' Map entry unconditionally, so a tile
                          ~70% through landing would instantly snap back to
                          the new pass's raw fromRow and re-fall from
                          scratch. Fixed by reading the in-flight
                          animation's own current interpolated position
                          before overwriting, so back-to-back falls in the
                          same cell read as one continuous drop. Verified
                          mathematically in isolation (the exact overwrite
                          scenario: a tile 68% through a fall now continues
                          from its true visual position instead of jumping
                          ~2.8 cells backward).
                          (2) Pausing didn't actually freeze the animation/
                          particle system — Render's only screen gate was
                          Nav.currentScreen() (the pause menu is a DOM
                          overlay, not a screen change), so a cascade queued
                          right before pausing kept playing on real
                          wall-clock time behind the overlay and was already
                          finished by the time the player resumed, directly
                          contradicting this module's own stated intent.
                          Fixed with a pause-aware clock (effectiveNow() =
                          real time minus total time spent paused) that
                          every animation timestamp is now measured against,
                          plus skipping updateParticles() entirely while
                          paused so nothing in the schedule queue can drain.
                          Verified live: particle counts held EXACTLY
                          unchanged across 800ms of real paused time, then
                          correctly resumed and settled after unpausing.
                          (3) Audio could still go silent mid-session even
                          after v0.6.0's resume-on-ensureCtx fix — that fix
                          was only wired to fresh-run-start and resume-
                          saved-session, not to ordinary pause/unpause or a
                          backgrounded tab, both real paths a browser can
                          suspend the AudioContext through. Added a
                          visibilitychange/blur auto-pause listener (matches
                          iridescentcosmology.html:5610-5620's exact
                          precedent — only ever force-pauses, never force-
                          resumes on refocus) that also re-resumes audio the
                          moment the tab becomes visible again, and made
                          togglePause() itself call Music.ensureCtx() on
                          unpause. Verified live: forcibly suspending the
                          real AudioContext and simulating a visibility
                          cycle now correctly auto-pauses on hide and reads
                          'running' again on return.
                          Also fixed a real, observed ~1-in-8 test flake in
                          tests/runeshatter-adversarial.js's bomb-chain test
                          (unseeded refill after a 13+ cell clear could
                          incidentally create an extra match) by seeding
                          Board's RNG for that one test — 8/8 clean reruns
                          after, vs. intermittent failures before. 53/53
                          adversarial + 41/41 audio tests passing.

   v0.6.0 — 2026-07-29 — Three fixes from real player feedback after ship:
                          (1) Gem movement animation, previously entirely
                          absent — every swap and every gravity/refill drop
                          snapped instantly with zero motion (only the
                          clear/bomb PARTICLE effects were ever animated).
                          Board.settlePass() now records, per column,
                          exactly how far each surviving tile is about to
                          fall and where each freshly-refilled tile enters
                          from (captured while grid still holds pre-gravity
                          positions, not guessed from a before/after diff),
                          pushed into the same timeline the clear/bomb
                          events already use. Game.attemptSwap() captures
                          the pre-swap tile snapshot and emits it so the two
                          swapped tiles visibly slide to trade places before
                          the cascade plays. State still resolves instantly
                          per §7 — this only adds POSITION data for
                          Render's existing "playback catches up" layer.
                          Verified: fall timeline data is exact (a tile
                          above a mid-board clear falls exactly 1 row, a
                          new tile enters from row -1), confirmed visually
                          via screenshot with a tile genuinely rendered
                          above the board mid-fall, and confirmed stable
                          under 40 rapid real-UI swaps fired faster than
                          any animation's own duration.
                          (2) Lightning's idle motion read as "overstimu-
                          lating" — it re-rolled every 70-200ms PER CELL
                          between two very different scale states (a 20%
                          size swing), meaning dozens of independent
                          strobes/second across an 8x8 board. Rebuilt
                          around "real lightning flashes occasionally, it
                          doesn't strobe constantly": neutral resting scale
                          (matching every other element's baseline instead
                          of sitting dimmed), a 550-1500ms re-roll (vs.
                          70-200ms), and an 18% chance of the brief bright
                          snap per roll (vs. 65%). Still a snap, not a
                          smooth pulse — the named exception in §5 still
                          holds, it's just rare and calm now.
                          (3) "I don't hear any music" — ensureCtx() never
                          called .resume() on a suspended AudioContext,
                          despite this module's own header claiming every
                          primitive is copied verbatim from
                          iridescentcosmology.html/infall.html, which both
                          do exactly this (infall.html:1777). A context
                          created synchronously inside a click handler
                          often auto-runs, but that's a browser-specific
                          heuristic, not a spec guarantee — real Safari and
                          some mobile Chrome versions are known to leave it
                          suspended regardless, which headless Playwright's
                          own autoplay handling never reproduced (all 41
                          audio tests passed both before and after this
                          fix). Now checked on every ensureCtx() call, not
                          just first creation, so resuming a saved session
                          or restarting after the tab was backgrounded also
