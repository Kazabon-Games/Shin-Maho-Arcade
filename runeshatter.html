<style>
:root{
  --bg:#140b30;
  --panel:#231442;
  --panel2:#301c58;
  --ink:#f4ecff;
  --ink-mid:#c2b3e8;
  --ink-soft:#8674b8;
  --neon:#ffcb5c;
  --neon2:#b98aff;

#gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none;}

.meta-row{position:fixed;bottom:8px;right:10px;display:flex;align-items:center;gap:6px;z-index:50;}
.version-marker{font-family:var(--mono);font-size:10px;color:var(--ink-soft);opacity:.6;
  letter-spacing:.02em;pointer-events:none;}

.scaffold-note{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;text-align:center;padding:20px;font-family:var(--display);}
.scaffold-note h1{font-size:2rem;color:var(--neon);letter-spacing:.1em;font-weight:600;}
.scaffold-note p{color:var(--ink-soft);font-family:var(--mono);font-size:.8rem;max-width:480px;}
