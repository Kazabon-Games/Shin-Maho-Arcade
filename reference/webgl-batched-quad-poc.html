<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebGL2 batched-quad PoC — nova-scenario stress test</title>
<style>
  html,body{margin:0;background:#0a0620;overflow:hidden;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
/*
  Self-contained WebGL2 batched-quad renderer -- no library, no CDN, no
  build step. The one specific technique that solves the measured
  problem (176ms avg / 1283ms worst frame during Iridescent Cosmology's
  real nova-burst scenario, all on Canvas 2D's per-draw-call CPU cost):
  every small entity (enemy, particle, nova-ring, gem, floating-number
  stand-in) is one instance in a single shared instance buffer, uploaded
  once per frame via bufferSubData, drawn with exactly ONE
  drawArraysInstanced call regardless of entity count. This mirrors the
  real technique behind PixiJS's ParticleContainer (per its own docs:
  batch many sprites into one/few draw calls) without depending on
  PixiJS itself -- matching this studio's own established "proven
  technique, not shared code" convention (STUDIO_BIBLE.md §5 Path B).

  Text glyph rendering is explicitly OUT of scope for this PoC (a real,
  separate WebGL sub-problem -- typically an SDF font atlas) -- floating
  damage numbers are represented here as small colored quads for load-
  budget purposes only, not real glyphs. Stated plainly so this isn't
  quietly treated as "text solved too."
*/

const canvas = document.getElementById('stage');
const gl = canvas.getContext('webgl2');
if (!gl) { document.title = 'WEBGL2 UNAVAILABLE'; throw new Error('no webgl2'); }

const dpr = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ---- Shaders: minimal, one shared unit-quad geometry, instanced ----
const VERT_SRC = `#version 300 es
layout(location=0) in vec2 a_corner;      // shared quad geometry, -0.5..0.5
layout(location=1) in vec2 i_pos;         // per-instance: center, pixels
layout(location=2) in float i_size;       // per-instance: radius, pixels
layout(location=3) in vec4 i_color;       // per-instance: rgba 0..1
layout(location=4) in float i_shape;      // 0=soft circle, 1=hard quad (gem-ish facet look, cheap)
uniform vec2 u_resolution;
out vec4 v_color;
out vec2 v_local;
out float v_shape;
void main(){
  vec2 pixelPos = i_pos + a_corner * i_size * 2.0;
  vec2 clip = (pixelPos / u_resolution) * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);
  v_color = i_color;
  v_local = a_corner * 2.0; // -1..1
  v_shape = i_shape;
}`;

const FRAG_SRC = `#version 300 es
precision mediump float;
in vec4 v_color;
in vec2 v_local;
in float v_shape;
out vec4 outColor;
void main(){
  float d = length(v_local);
  if (v_shape < 0.5) {
    // soft circle -- cheap analytic falloff, no texture sample needed
    float a = smoothstep(1.0, 0.75, d);
    if (a <= 0.001) discard;
    outColor = vec4(v_color.rgb, v_color.a * a);
  } else {
    if (d > 1.0) discard;
    // faceted-gem-ish alternating tint by angle octant, same spirit as
    // the studio's real shadeHex() facet-fan idiom, computed cheaply in
    // the fragment shader instead of pre-baked per-vertex triangles
    float ang = atan(v_local.y, v_local.x);
    float facet = mod(floor((ang + 3.14159265) / (3.14159265 / 4.0)), 2.0);
    vec3 c = v_color.rgb * (facet < 0.5 ? 1.12 : 0.86);
    outColor = vec4(c, v_color.a);
  }
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT_SRC));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG_SRC));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const u_resolution = gl.getUniformLocation(prog, 'u_resolution');

// ---- Shared quad geometry (2 triangles) ----
const quadVerts = new Float32Array([-0.5,-0.5, 0.5,-0.5, -0.5,0.5, 0.5,-0.5, 0.5,0.5, -0.5,0.5]);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, quadVerts, gl.STATIC_DRAW);

// ---- Instance buffer: pos(2) + size(1) + color(4) + shape(1) = 8 floats/instance ----
const MAX_INSTANCES = 2000; // real worst-case budget: 320 enemies + 150 particles + 40 rings + 40 "text" quads + 300 gems = 850, generous headroom
const FLOATS_PER_INSTANCE = 8;
const instanceData = new Float32Array(MAX_INSTANCES * FLOATS_PER_INSTANCE);
const instanceBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
gl.bufferData(gl.ARRAY_BUFFER, instanceData.byteLength, gl.DYNAMIC_DRAW);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
const STRIDE = FLOATS_PER_INSTANCE * 4;
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, STRIDE, 0);  gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, STRIDE, 8);  gl.vertexAttribDivisor(2, 1);
gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 4, gl.FLOAT, false, STRIDE, 12); gl.vertexAttribDivisor(3, 1);
gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 1, gl.FLOAT, false, STRIDE, 28); gl.vertexAttribDivisor(4, 1);

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

// ---- Simulation state, matching the real game's caps exactly ----
// (iridescentcosmology.html: MAX_PARTICLES=150 (:2626), MAX_GEMS=300 (:2635),
// novaRings cap 40 (:4074), floatTexts cap 40 (:5894), enemy hard cap 320 (:3223))
const MAX_PARTICLES = 150, MAX_GEMS = 300, MAX_RINGS = 40, MAX_FLOATTEXT = 40, MAX_ENEMIES = 320;

function rand(a, b) { return a + Math.random() * (b - a); }

let enemies = [], particles = [], rings = [], floatText = [], gems = [];
const CENTER = () => ({ x: window.innerWidth / 2, y: window.innerHeight / 2 });

window.__test = {
  spawnClusteredEnemies(n) {
    const c = CENTER();
    for (let i = 0; i < n && enemies.length < MAX_ENEMIES; i++) {
      const ang = Math.random() * Math.PI * 2, dist = 20 + Math.random() * 150;
      enemies.push({
        x: c.x + Math.cos(ang) * dist, y: c.y + Math.sin(ang) * dist,
        r: 8 + Math.random() * 20, color: [Math.random(), Math.random() * 0.4 + 0.3, Math.random() * 0.6 + 0.4, 1],
        alive: true
      });
    }
    return enemies.length;
  },
  triggerNova() {
    // exact same shape as the real kill handler: every enemy in radius
    // dies simultaneously, each spawns a real burst (7-26 particles
    // depending on "type"), a ring, gem(s), and a floating-text stand-in
    // -- all gated by the same real MAX_* caps the shipped game uses
    for (const e of enemies) {
      if (!e.alive) continue;
      e.alive = false;
      const burstCount = 7 + Math.floor(Math.random() * 20);
      if (particles.length < MAX_PARTICLES) {
        for (let i = 0; i < burstCount && particles.length < MAX_PARTICLES; i++) {
          const a = (Math.PI * 2 / burstCount) * i + rand(-0.2, 0.2);
          const spd = rand(75, 260);
          particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: rand(0.3, 0.5), maxLife: 0.5, color: e.color, shape: 1 });
        }
      }
      if (rings.length < MAX_RINGS) rings.push({ x: e.x, y: e.y, r: 0, max: e.r + 18, life: 0.22, maxLife: 0.22 });
      if (floatText.length < MAX_FLOATTEXT) floatText.push({ x: e.x, y: e.y - 10, life: 0.6, maxLife: 0.6 });
      if (gems.length < MAX_GEMS) {
        const n = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < n && gems.length < MAX_GEMS; i++) {
          gems.push({ x: e.x + rand(-10, 10), y: e.y + rand(-10, 10), vx: rand(-40, 40), vy: rand(-70, -20), life: 3 });
        }
      }
    }
    enemies = enemies.filter(e => e.alive);
  },
  state() { return { enemies: enemies.length, particles: particles.length, rings: rings.length, gems: gems.length, floatText: floatText.length }; }
};

function step(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r = r.max * (1 - r.life / r.maxLife); }
  rings = rings.filter(r => r.life > 0);
  for (const f of floatText) { f.y -= 20 * dt; f.life -= dt; }
  floatText = floatText.filter(f => f.life > 0);
  for (const g of gems) { g.x += g.vx * dt; g.y += g.vy * dt; g.vy += 60 * dt; g.life -= dt; }
  gems = gems.filter(g => g.life > 0);
}

let n = 0;
function write(x, y, size, r, g, b, a, shape) {
  const o = n * FLOATS_PER_INSTANCE;
  instanceData[o] = x; instanceData[o + 1] = y; instanceData[o + 2] = size;
  instanceData[o + 3] = r; instanceData[o + 4] = g; instanceData[o + 5] = b; instanceData[o + 6] = a;
  instanceData[o + 7] = shape;
  n++;
}

function render() {
  gl.clearColor(0.04, 0.024, 0.125, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  n = 0;
  for (const e of enemies) if (n < MAX_INSTANCES) write(e.x, e.y, e.r, e.color[0], e.color[1], e.color[2], 1, 1);
  for (const p of particles) if (n < MAX_INSTANCES) write(p.x, p.y, 3, p.color[0], p.color[1], p.color[2], p.life / p.maxLife, 0);
  for (const r of rings) if (n < MAX_INSTANCES) write(r.x, r.y, r.r, 1, 1, 1, (r.life / r.maxLife) * 0.5, 0);
  for (const f of floatText) if (n < MAX_INSTANCES) write(f.x, f.y, 4, 1, 0.85, 0.4, f.life / f.maxLife, 0);
  for (const g of gems) if (n < MAX_INSTANCES) write(g.x, g.y, 3, 0.4, 0.8, 1, 1, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, instanceData, 0, n * FLOATS_PER_INSTANCE);

  gl.useProgram(prog);
  gl.uniform2f(u_resolution, canvas.width, canvas.height);
  gl.bindVertexArray(vao);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, n); // ONE draw call, every entity, regardless of count
}

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 0.05);
  last = t;
  step(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
