  // reference set: a small faceted-gem node at each major joint, reusing
  // this studio's actual signature rendering technique (see the
  // faceted-gem-rendering skill -- alternating lit/dark facets fanned from
  // a center point, a soft glow behind it, a translucent outer ring) at a
  // scale that reads as a socketed crystal joint rather than a full gem
  // shape. This is what makes the rig read as *this* studio's character
  // rather than a reskin of any other stickman-brawler asset -- same
  // "arcane" visual identity Shin Mahou Arcade's other games already
  // carry (Sigil Chain's runes, Iridescent Cosmology's Rites), just never
  // applied to a rig before.
  function drawJointGem(p, radius, baseColor) {
    const sides = 7; // odd count, same reasoning the skill gives for hand-authored asymmetry over a uniform even fan: avoids a perfectly mirrored look even at this small a scale
    ctx.save();
    ctx.shadowBlur = radius * 2.2;
    ctx.shadowColor = baseColor;
    for (let i = 0; i < sides; i++) {
      const a0 = (i / sides) * Math.PI * 2, a1 = ((i + 1) / sides) * Math.PI * 2;
      const lit = i % 2 === 0;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(a0) * radius, p.y + Math.sin(a0) * radius);
      ctx.lineTo(p.x + Math.cos(a1) * radius, p.y + Math.sin(a1) * radius);
      ctx.closePath();
      ctx.fillStyle = shadeHex(baseColor, lit ? 20 : -18, lit ? 10 : -8);
      ctx.fill();
      ctx.shadowBlur = 0; // only the first facet needs to cast the glow -- repeating it per-facet would blur every internal edge, not just the silhouette
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function renderRig(j, color) {
    const c = color || '#e8e8f0';
    const outline = shadeHex(c, -38, -10); // a darker shade of the same hue, not a universal black -- keeps P1/P2 distinguishable by outline too, not just fill
    // Every thickness/radius below is scaled by the same renderScale
    // solveRig() already applies to joint positions (see resize()'s own
    // comment) -- without this, a narrow-viewport rig would keep its full
    // desktop limb thickness/joint-gem size around a shrunk skeleton and
    // read as stubby/disproportionate instead of a consistently smaller
    // version of the same character.
    const s = renderScale;
    // legs first (drawn behind torso) -- each leg is now ONE continuous
    // chain (hip->knee->foot) instead of two separate tapered shapes
    // meeting at the knee, so there's no internal seam for the joint gem
    // to have to hide. Chunkier taper than a classic stick figure, matching
    // the reference set's thick-limb proportions.
    drawLimbChain([j.hipL, j.kneeL, j.footL], [16 * s, 11 * s, 8 * s], c, outline);
    drawLimbChain([j.hipR, j.kneeR, j.footR], [16 * s, 11 * s, 8 * s], c, outline);
    drawTerminal(j.footL, 7 * s, c, outline);
    drawTerminal(j.footR, 7 * s, c, outline);
    drawJointGem(j.hipL, 4.5 * s, c); drawJointGem(j.kneeL, 4 * s, c);
    drawJointGem(j.hipR, 4.5 * s, c); drawJointGem(j.kneeR, 4 * s, c);

    // spine -- solid wedge widening toward the chest/shoulders (already a
    // single 2-point segment, no internal joint to smooth)
    drawLimb(j.pelvis, j.chest, 13 * s, 17 * s, c, outline);

    // arms -- same one-continuous-chain treatment as the legs
    // (shoulder->elbow->hand)
    drawLimbChain([j.shoulderL, j.elbowL, j.handL], [10 * s, 8 * s, 7 * s], c, outline);
    drawLimbChain([j.shoulderR, j.elbowR, j.handR], [10 * s, 8 * s, 7 * s], c, outline);
    drawTerminal(j.handL, 6.5 * s, c, outline);
    drawTerminal(j.handR, 6.5 * s, c, outline);
    drawJointGem(j.shoulderL, 4.5 * s, c); drawJointGem(j.elbowL, 4 * s, c);
    drawJointGem(j.shoulderR, 4.5 * s, c); drawJointGem(j.elbowR, 4 * s, c);

    // chest core -- a slightly larger signature gem, the one Rykndu-
    // specific mark rather than a repeated joint detail (the studio's
    // "Grimoire vocabulary" already treats a core/rite/rune as the
    // recognizable emblem of a character or system elsewhere -- this is
    // that idea applied to the rig itself)
    drawJointGem(j.chest, 6.5 * s, c);

    // head -- flat fill matching the flat-silhouette style, same outline
    // treatment as the limbs so it reads as one consistent character
    ctx.beginPath(); ctx.arc(j.head.x, j.head.y, (LEN.headR + 2.4) * s, 0, Math.PI * 2); ctx.fillStyle = outline; ctx.fill();
    ctx.beginPath(); ctx.arc(j.head.x, j.head.y, LEN.headR * s, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
  }

  // ---- Guard meter (v0.1.24) ----
  // A stamina cost with nothing visible to show it would just read as
  // "guard randomly stopped working" -- the whole point of a real
  // resource is that the player can see it spend down. Drawn as a small
  // world-space bar above the rig's own head (follows the character,
  // scales with renderScale the same as everything else about it) rather
  // than a fixed HUD element, since "the player is looking at the rig
  // most of the time" is this project's own stated design priority --
  // the meter belongs on the character, not off in a corner.
  function drawGuardMeter(j, meter, color) {
    const s = renderScale;
    const w = 34 * s, h = 4 * s;
    const x = j.head.x - w / 2, y = j.head.y - (LEN.headR + 12) * s;
    const pct = Math.max(0, Math.min(1, meter / GUARD_METER_MAX));
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(x, y, w, h);
    // Low meter reads as a warning (amber) rather than the rig's own
    // color once it's under a quarter full -- the moment guard is at
    // real risk of being forced out, not just a smaller bar in the same hue.
    ctx.fillStyle = pct < 0.25 ? '#ffb84d' : color;
    ctx.fillRect(x, y, w * pct, h);
  }

  // ---- Audio (SFX only — no music yet, nothing to score). One sfxGain ->
  // one DynamicsCompressor -> destination, per the adaptive-game-audio
  // skill's "how much do you actually need" guidance (Sigil Chain's scoped-
  // down shape, not Wonderland's full graph): a reflex-timing game's first
  // audio need is a set of distinct, instantly-legible one-shot stingers,
  // not a produced mix. Deliberately NO reverb send here even though both
  // reference Music modules have one — a reverb tail would blur the exact
  // transient onset this pass exists to sharpen (the producer's "couldn't
  // tell when to hit" problem is a clarity problem, not an atmosphere gap).
  // Every voice below is a fully-scheduled one-shot burst fired at a single
  // event instant (startAttack(), a kill, a miss, a proximity threshold
  // crossing) — none of them are continuously-updated per-frame automation,
  // so none of them need the cancel-then-ramp idiom the skill polices for
  // ongoing values; they just fire and finish.
  const SFX = (function () {
    let ctx, sfx, compressor, started = false;

    function ensureCtx() {
      // v0.1.30 fix: this used to be a bare `if (ctx) return;` -- real bug
      // (capability audit, live-Playwright-verified): a backgrounded tab's
      // AudioContext gets suspended by the browser (documented behavior,
      // worst on mobile), and with the old guard there was zero code path
      // back to sound for the rest of the session once that happened --
      // `.resume()` never appeared anywhere in this file. Checked on every
      // call, not just first creation (matches runeshatter.html:1552-1566's
      // own ensureCtx() precedent, the one game in the studio that already
      // gets this right), so a call from the visibilitychange listener
      // below, or a fresh gameplay input after the tab comes back, both
      // resume the SAME shared context rather than being no-ops against a
      // suspended one. SFX is the actual root of the shared context --
      // Music.ensureCtx() and TitleTheme.ensureCtx() both call
      // SFX.getCtx()/SFX.getBus() rather than creating their own -- so
      // resuming here is sufficient for all three modules at once.
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
      sfx = ctx.createGain(); sfx.gain.value = 0.6;
      compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -18; compressor.knee.value = 12;
      compressor.ratio.value = 4; compressor.attack.value = 0.003; compressor.release.value = 0.22;
      sfx.connect(compressor); compressor.connect(ctx.destination);
      started = true;
      Music.ensureCtx(); // shares this exact context/compressor -- see rykndu-assets/music/MUSIC_DIRECTION.md
    }

    // Windup whoosh — startAttack(): a rising bandpass noise sweep timed to
    // exactly the 110ms windup duration, so its rising pitch peaks right as
    // the strike phase begins. This is the "get ready" telegraph.
    function windupWhoosh() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * 0.13);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.5);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
      bp.frequency.setValueAtTime(400, t);
      bp.frequency.exponentialRampToValueAtTime(1800, t + 0.11); // 110ms == the windup phase duration exactly
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      src.connect(bp); bp.connect(g); g.connect(sfx);
      src.start(t);
    }

    // Strike-connect impact — resolveHits(), on a kill: pitch-drop sine
    // thump + a short noise click transient. Percussive/punchy on purpose,
    // the timbral opposite of missBuzz() below so a connect and a miss can
    // never be confused by ear alone.
    function strikeImpact() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(240, t);
      o.frequency.exponentialRampToValueAtTime(55, t + 0.08);
      o.connect(g); g.connect(sfx);
      o.start(t); o.stop(t + 0.18);

      const clen = Math.floor(ctx.sampleRate * 0.012);
      const cbuf = ctx.createBuffer(1, clen, ctx.sampleRate);
      const cd = cbuf.getChannelData(0);
      for (let i = 0; i < clen; i++) cd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / clen, 4);
      const csrc = ctx.createBufferSource(); csrc.buffer = cbuf;
      const chp = ctx.createBiquadFilter(); chp.type = 'highpass'; chp.frequency.value = 2000;
      const cg = ctx.createGain(); cg.gain.value = 0.35;
      csrc.connect(chp); chp.connect(cg); cg.connect(sfx);
      csrc.start(t);
    }

    // Miss buzzer — updateEnemies()'s miss branch, when an enemy reaches
    // melee range unanswered: two detuned, descending SQUARE oscillators
    // (harsh/buzzy on purpose — square + detune beating reads as "wrong"),
    // the timbral opposite of strikeImpact()'s sine thump.
    function missBuzz() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.2, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      lp.connect(g); g.connect(sfx);
      const o1 = ctx.createOscillator(); o1.type = 'square';
      o1.frequency.setValueAtTime(200, t);
      o1.frequency.exponentialRampToValueAtTime(90, t + 0.24);
      const o2 = ctx.createOscillator(); o2.type = 'square';
      o2.frequency.setValueAtTime(206, t); // ~1.03x detune for a harsh beating "wrong" texture
      o2.frequency.exponentialRampToValueAtTime(92.7, t + 0.24);
      const g2 = ctx.createGain(); g2.gain.value = 0.6;
      o1.connect(lp); o2.connect(g2); g2.connect(lp);
      o1.start(t); o2.start(t); o1.stop(t + 0.27); o2.stop(t + 0.27);
    }

    // Proximity pulse — updateEnemies(), fired once per enemy at each of
    // three fixed travel-fraction thresholds (0.4 / 0.7 / 0.9 of
    // ENEMY_TRAVEL_MS). This is an event-gated one-shot pattern, NOT
    // continuous per-frame automation: each pulse is a fully-scheduled
    // burst fired the single frame its threshold is crossed, never a value
    // ramped again on every tick, so it doesn't need (and deliberately
    // avoids) the cancel-then-ramp idiom. A pure-sine "beep" — the least
    // textured of the four voices on purpose, so it never gets mistaken for
    // the swept whoosh, the punchy impact, or the buzzy miss. Pitch, volume
    // rise and duration shortens pulse-to-pulse so the three read as an
    // accelerating "closing in" telegraph rather than three identical dings.
    const PULSE_DEFS = [
      { freq: 400, dur: 0.09, vol: 0.12 },
      { freq: 550, dur: 0.07, vol: 0.16 },
      { freq: 750, dur: 0.05, vol: 0.22 }
    ];
    function proximityPulse(stage) {
      if (!ctx) return;
      const def = PULSE_DEFS[stage];
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(def.vol, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + def.dur);
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = def.freq;
      o.connect(g); g.connect(sfx);
      o.start(t); o.stop(t + def.dur + 0.02);
    }

    // Parry chime (v0.1.25) — resolveDuelHit()'s parry branch, deliberately
    // distinct from every other voice here: a bright two-harmonic ring
    // (not strikeImpact()'s low thump, missBuzz()'s harsh buzz, or
    // windupWhoosh()'s sweep) so a successful parry reads as its own
    // rewarding event, not just a differently-timed block.
    function parryChime() {
      if (!ctx) return;
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.35, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = 880;
      const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 1320; // a fifth above -- reads as a bright chime, not a single tone
      const g2 = ctx.createGain(); g2.gain.value = 0.5;
      o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(sfx);
      o1.start(t); o2.start(t); o1.stop(t + 0.36); o2.stop(t + 0.36);
    }

    return {
      ensureCtx, windupWhoosh, strikeImpact, missBuzz, proximityPulse, parryChime,
      getCtx: () => ctx, getBus: () => compressor, getSfxGain: () => sfx,
      // audioCtxState/audioCtxSuspend: added alongside the v0.1.30 resume
      // fix so tests/rig-audio-resume.js can drive a real suspend/restore
      // cycle against the actual shared AudioContext (not a mock), the
      // same "internal _test hook + real UI-driven interaction" convention
      // every existing tests/rig-*.js suite already uses (per this repo's
      // CLAUDE.md). audioCtxSuspend() calls the real ctx.suspend() browser
      // API directly -- it's how a capability audit verifies the fix, not
      // a new production code path.
      _test: {
        isStarted: () => started, sfxGainValue: () => sfx ? sfx.gain.value : null,
        audioCtxState: () => ctx ? ctx.state : null,
        audioCtxSuspend: () => ctx ? ctx.suspend() : Promise.resolve()
      }
    };
  })();

  // ---- Music: continuous adaptive drone bed (v2 -- per-mode identity) ----
  // See prototypes/rykndu-assets/music/MUSIC_DIRECTION.md for the full
  // design rationale, most importantly: NO ConvolverNode anywhere in this
  // module -- tests/rig-audio.js §6 asserts zero across the whole session
  // (a deliberate, already-tested "stay dry" decision from the v0.1.6
  // quality pass), so the standard adaptive-game-audio synthesized-reverb
  // technique is deliberately not used here, including in v2's stingers
  // (bell() below routes to sfxGain, never through a convolver).
  const Music = (function () {
    let ctx, bus, sfxGain, master, duckGain, droneFilter, clashVoice, started = false;
    let voices = [];
    let targetIntensity = 0, intensity = 0;
    let targetDuelProximity = 0, duelProximity = 0;
    let mode = 'gauntlet';
    let reducedAudio = false;
    let nextHeartbeatAt = 0;

    // cancel-then-set-then-ramp -- the mandatory idiom (adaptive-game-audio)
    // for every SCHEDULED gain change. Never used for tick()'s per-frame
    // writes below, which are already smoothed in JS and use direct .value
    // assignment instead -- mixing the two patterns on the same AudioParam
    // is the exact "dying sticks the music" bug this rule exists to prevent.
    function rampGain(param, target, seconds) {
      const t = ctx.currentTime;
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
      param.linearRampToValueAtTime(target, t + seconds);
    }

    function ensureCtx() {
      if (started) return;
      ctx = SFX.getCtx();
      bus = SFX.getBus();
      sfxGain = SFX.getSfxGain(); // stingers route here, not through droneFilter -- must not get swallowed by whatever the lowpass cutoff happens to be
      master = ctx.createGain(); master.gain.value = 0.0001;
      duckGain = ctx.createGain(); duckGain.gain.value = 1;
      droneFilter = ctx.createBiquadFilter();
      droneFilter.type = 'lowpass'; droneFilter.frequency.value = 400; droneFilter.Q.value = 0.7;
      master.connect(duckGain); duckGain.connect(droneFilter); droneFilter.connect(bus);
      // Three detuned low voices -- root (~C2), a near-unison detune (tension
      // shimmer once the second voice fades in via tick(), see below), and a
      // fifth (~G2). Frequencies picked deliberately clear of every SFX
      // voice's own magic numbers (240/55/200/206/400/550/750/880/1320Hz) so
      // this drone can never be mistaken for an SFX oscillator by
      // tests/rig-audio.js's type/frequency filters.
      const roots = [65.41, 65.74, 98.0];
      voices = roots.map((f, i) => {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
        const g = ctx.createGain(); g.gain.value = i === 1 ? 0.0001 : (i === 2 ? 0.16 : 0.24);
        o.connect(g); g.connect(master);
        o.start();
        return { o, g };
      });
      // Duel-only clash voice: tritone of the C2 root, one octave up
      // (F#3, 185.00Hz) -- the score's one dissonant interval, reserved for
      // Duel specifically (a tritone has no home key, fitting two evenly-
      // matched opponents in unresolved conflict). Gauntlet's threat is
      // known/physical, so it's handled by rhythm (the heartbeat below)
      // instead, never by pitch -- silent (gain ~0) whenever mode isn't 'duel'.
      const cv = ctx.createOscillator(); cv.type = 'sawtooth'; cv.frequency.value = 185.00;
      const cvg = ctx.createGain(); cvg.gain.value = 0.0001;
      cv.connect(cvg); cvg.connect(master);
      cv.start();
      clashVoice = { o: cv, g: cvg };
      started = true;
      rampGain(master.gain, 0.13, 1.4); // fade in on real audio start, not an instant on/off
    }

    // Continuous per-frame smoothing -- called from frame() every tick,
    // NOT event-gated. Direct .value writes only, per the rule above.
    // Not a risk mixing with rampGain()'s scheduled automation: tick() only
    // ever touches droneFilter.frequency/Q, a drone voice's own gain, and
    // clashVoice's gain -- disjoint AudioParams from duckGain.gain, the only
    // param rampGain() ever schedules against.
    function tick() {
      if (!started) return;
      intensity += (targetIntensity - intensity) * 0.03;
      duelProximity += (targetDuelProximity - duelProximity) * 0.03;

      const duel = mode === 'duel';
      droneFilter.Q.value = duel ? 2.2 : 0.7;
      droneFilter.frequency.value = (duel ? 520 : 380) + intensity * 1500;
      voices[1].g.gain.value = 0.10 + intensity * 0.20;
      clashVoice.g.gain.value = duel ? (0.0001 + duelProximity * 0.16) : 0.0001;

      // Gauntlet-only heartbeat: a real elapsed-time lookahead scheduler,
      // sub-bass sine sweep 90->42Hz, interval shortens as intensity rises
      // -- the "closing physical threat" made audible as a literal pulse.
      if (!duel && !reducedAudio && ctx.currentTime >= nextHeartbeatAt) {
        fireHeartbeat();
        nextHeartbeatAt = ctx.currentTime + Math.max(0.4, 1.15 - intensity * 0.75);
      }
    }

    function fireHeartbeat() {
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.05 + intensity * 0.15, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      g.connect(duckGain); // rides the same duck+droneFilter chain as the drone; cutoff never attenuates it (always >=380Hz, well above 42-90Hz)
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(90, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
      o.connect(g); o.start(t); o.stop(t + 0.22);
    }

    // 0..1, set every frame by the caller from real combat state -- the
    // actual "mood as a live input" mechanism, not a fixed track swap.
    function setIntensity(v) { targetIntensity = Math.max(0, Math.min(1, v)); }
    // 0..1, Duel-only: how close the two rigs currently are, drives the
    // clash voice directly (not blended through the general intensity).
    function setDuelProximity(v) { targetDuelProximity = Math.max(0, Math.min(1, v)); }
    function setMode(m) { mode = m; }
    // Reduced-motion-equivalent audio cap (MUSIC_DIRECTION.md's own named
    // v2 gap) -- silences the driving Gauntlet heartbeat specifically, the
    // audio equivalent of screen shake, mirroring shakeMag's existing
    // reducedMotion-gated convention elsewhere in this file.
    function setReducedAudio(v) { reducedAudio = !!v; }

    // Sidechain-style duck on a punctuating hit (strike connect, parry) --
    // the one genuinely one-shot, SCHEDULED event among the continuous
    // writes above, so it correctly uses rampGain (the dip) + setTargetAtTime
    // (the recovery).
    function duck() {
      if (!started) return;
      rampGain(duckGain.gain, 0.35, 0.03);
      duckGain.gain.setTargetAtTime(1, ctx.currentTime + 0.05, 0.12);
    }

    // bell() -- same fundamental+2.01x-overtone sine idiom as sigilchain.html
    // / iridescentcosmology.html, minus the reverb send: connects to
    // sfxGain, never droneFilter, so a stinger can't get swallowed by
    // whatever the drone's lowpass cutoff happens to be that instant.
    function bell(freq, dur, vol) {
      if (!started) return;
      const t = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.5));
      g.connect(sfxGain);
      const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.01;
      const g2 = ctx.createGain(); g2.gain.value = 0.28;
      o2.connect(g2); g2.connect(g); o1.connect(g);
      o1.start(t); o2.start(t);
      o1.stop(t + (dur || 0.5) + 0.05); o2.stop(t + (dur || 0.5) + 0.05);
    }

    // Signature motif: an open perfect fifth, C6/G6 -- checked >100Hz clear
    // of every existing SFX/drone frequency. Never a full triad anywhere in
    // this score (matches the drone's own C+G-only harmony) -- every accent
    // event below uses these same two pitches so one consistent "moment of
    // consequence" signature covers all of them.
    const MOTIF_ROOT = 1046.50, MOTIF_FIFTH = 1567.98;

    function parryStinger() { bell(MOTIF_FIFTH, 0.18, 0.09); } // one quiet grace-note under SFX.parryChime()'s existing 880/1320 tones
    function ringOutStinger() {
      bell(MOTIF_ROOT, 0.16, 0.14);
      setTimeout(() => bell(MOTIF_FIFTH, 0.24, 0.16), 70);
    }
    function matchWinStinger() {
      bell(MOTIF_ROOT, 0.3, 0.18);
      setTimeout(() => bell(MOTIF_FIFTH, 0.35, 0.2), 130);
      setTimeout(() => bell(MOTIF_ROOT, 0.5, 0.22), 320);
      setTimeout(() => bell(MOTIF_FIFTH, 0.9, 0.26), 500); // landing ring
    }

    return {
      ensureCtx, tick, setIntensity, setDuelProximity, setMode, setReducedAudio, duck,
      parryStinger, ringOutStinger, matchWinStinger,
      _test: {
        isStarted: () => started,
        intensityValue: () => intensity,
        targetIntensityValue: () => targetIntensity,
        duelProximityValue: () => duelProximity,
        modeValue: () => mode,
        clashVoiceGain: () => clashVoice ? clashVoice.g.gain.value : null,
        droneFilterQ: () => droneFilter ? droneFilter.Q.value : null
      }
    };
  })();
  // ---- TitleTheme: title/mode-select screen's own composed OST (v0.1.29) --
  // A module distinct from Music (the adaptive GAMEPLAY score above, whose
  // own behavior/frequencies/gains are untouched by this addition). Shares
  // SFX's AudioContext/compressor exactly the way Music does (SFX.getCtx()/
  // SFX.getBus()) -- never a second AudioContext, the exact "second
  // uncoordinated signal path" mistake MUSIC_DIRECTION.md documents Music
  // itself avoiding. Six real synthesized voices (sub-bass, unison-stack
  // pad, FM lead, FM countermelody, a free-timed soft pulse, a sparse
  // noise-burst shimmer) over a real 32-second section timeline (Intro ->
  // Statement -> Build -> Full restatement -> Tail), scheduled with the
  // standard Web Audio lookahead pattern (see iridescentcosmology.html's
  // schedulerTick()/STEP_SEC() -- same idiom, a fixed-length list of
  // section-entry events instead of a 16th-note grid, because a menu theme
  // has no beat to lock a grid to).
  //
  // The one deliberate constraint change this file makes: a real
  // ConvolverNode (synthesized reverb impulse, adaptive-game-audio's
  // documented "exponentially-decaying stereo noise burst" technique).
  // rykndu-assets/music/MUSIC_DIRECTION.md explicitly pre-authorizes this
  // exact move ("if a future pass wants reverb on the music bed
  // specifically (not the SFX), that's a deliberate decision to make
  // explicitly, updating the test's own asserted scope in the same commit
  // -- not something to add quietly") -- see tests/rig-audio.js §6's
  // updated comment and the new tests/rig-title-theme.js for the live
  // verification that the reverb stays scoped to exactly this module's
  // lead/countermelody/shimmer sends and never touches SFX's four dry
  // one-shots or Music's own drone, both of which stay exactly as dry as
  // before.
  const TitleTheme = (function () {
    let ctx, sfxBus, master, limiter, started = false, stopped = false;
    let schedulerHandle = null, cycleAnchorTime = 0, eventIdx = 0;
    let pulseActive = false, nextPulseAt = 0;

    let subBassGain, subC, subG;
    let padLowpass, padDryGain, padChorusSendGain, padPanner, padPanLFO, padPanLFODepth;
    let chorusDelay, chorusLFO, chorusLFODepth, chorusWetGain;
    let leadPanner, leadDryGain, leadReverbSendGain;
    let cmPanner, cmDryGain, cmReverbSendGain; // countermelody
    let reverbInputBus, reverb, reverbWetGain;
    let pulseBus;
    let shimmerDryGain, shimmerReverbSendGain;

    const CYCLE_SEC = 32;
    const T_STATEMENT = 6.0, T_BUILD = 14.0, T_FULL = 22.0, T_TAIL = 29.0;

    // Same C-rooted signature-motif pitches Music's own bell() stinger
    // already uses (MOTIF_ROOT/MOTIF_FIFTH there), plus a C-pentatonic
    // scale built off the same root -- one consistent melodic vocabulary
    // across the gameplay score's stingers and this piece's lead, not two
    // coincidentally-similar ones.
    const N = {
      C6: 1046.50, G6: 1567.98,               // the exact ringOutStinger gesture, quoted below
      C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00,
      C4: 261.63, D4: 293.66, G4: 392.00,
    };
    // Sub-bass reuses Music's own drone root/fifth exactly (65.41/98.0Hz,
    // C2/G2) -- deliberate, see the module-level comment above: Music's
    // drone starts as a side effect of the same SFX.ensureCtx() cascade
    // this module's gesture handler also triggers, so this sub-bass layer
    // is built to reinforce that incidental bleed rather than clash with it.
    const SUB_C2 = 65.41, SUB_G2 = 98.0;

    // Classic 2:1 FM ratio (modulator = 2x carrier). The index below is
    // (peak frequency deviation / modulator frequency) -- ~2.0 reads as a
    // bright, clean bell/electric-piano; much past ~4 it turns metallic/
    // harsh. Picked by ear via TitleTheme._test.previewFromSection() while
    // building this, not guessed and shipped on a first value -- still a
    // judgment call a human listening pass may want to move, see the task
    // report for exactly this line.
    const LEAD_FM_INDEX = 2.0, CM_FM_INDEX = 0.9;

    // Cancel-then-set-then-ramp -- the mandatory idiom (adaptive-game-audio,
    // also Music's own rampGain above) for every SCHEDULED gain change.
    // Every write in this module is either this (a fixed-duration swell/
    // fade tied to a specific section or note event) or a note's own
    // self-contained envelope (padChord/fmNote/firePulse/fireShimmer,
    // each on a gain node nothing else ever touches) -- never a per-frame
    // continuous write, so there is no "dying sticks the music" collision
    // class possible here at all (this module has no per-frame tick()).
    function rampGain(param, target, seconds) {
      const t = ctx.currentTime;
      param.cancelScheduledValues(t);
      param.setValueAtTime(param.value, t);
      param.linearRampToValueAtTime(target, t + seconds);
    }

    function ensureCtx() {
      if (started || stopped) return; // once stopped, never restarts -- see stop()'s own comment
      ctx = SFX.getCtx();
      sfxBus = SFX.getBus();

      master = ctx.createGain(); master.gain.value = 0.0001;
      // A SEPARATE limiter from SFX's shared compressor (-18dB/4:1, tuned
      // for one-shot transients) -- this module stacks 6 continuous voices
      // at once, a genuinely different signal shape (sustained, not
      // transient), so it gets its own brick-wall-ish stage rather than
      // leaning on a compressor tuned for something else. SFX's own
      // compressor settings are completely untouched by this.
      limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -1; limiter.knee.value = 0;
      limiter.ratio.value = 20; limiter.attack.value = 0.001; limiter.release.value = 0.08;
      master.connect(limiter); limiter.connect(sfxBus);

      buildSubBass();
      buildPad();
      buildLeadAndCountermelody();
      buildShimmerBus();
      buildReverb(); // after lead/countermelody/shimmer so their send gains already exist to connect into it
      buildPulseBus();

      started = true;
      rampGain(master.gain, 0.85, 4.5); // the Intro's own fade-in -- sub-bass alone, nothing else scheduled until T_STATEMENT

      cycleAnchorTime = ctx.currentTime;
      eventIdx = 0;
      schedulerHandle = setInterval(schedulerTick, 30);
    }

    // Voice 1/6 -- sub-bass: the continuity anchor. Never stopped/
    // restarted for the module's whole lifetime (same philosophy Music's
    // own drone voices already use) -- dry, centered, always-on so every
    // cycle after the first finds it already running rather than
    // re-attacking, which is what makes the Tail->Intro seam feel like one
    // continuous piece instead of a loop point.
    function buildSubBass() {
      subBassGain = ctx.createGain(); subBassGain.gain.value = 0.34;
      subBassGain.connect(master);
      function mkSub(freq) {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
        const g = ctx.createGain(); g.gain.value = 0.55;
        o.connect(g); g.connect(subBassGain);
        o.start();
        return { o, g };
      }
      subC = mkSub(SUB_C2);
      subG = mkSub(SUB_G2);
    }

    // Voice 2/6 -- unison-stack pad: one persistent shared bus (padLowpass
    // -> dry tap + chorus send -> shared panner -> master). Individual
    // padChord() calls below only ever add oscillators feeding INTO
    // padLowpass -- they never touch this wiring, so there's exactly one
    // signal path to verify rather than one per chord.
    function buildPad() {
      padLowpass = ctx.createBiquadFilter(); padLowpass.type = 'lowpass'; padLowpass.frequency.value = 1100;

      padDryGain = ctx.createGain(); padDryGain.gain.value = 0.0001;
      padChorusSendGain = ctx.createGain(); padChorusSendGain.gain.value = 0.0001;
      padLowpass.connect(padDryGain);
      padLowpass.connect(padChorusSendGain);

      // Chorus: a ~22ms delay whose time is modulated by a slow sub-Hz LFO
      // -- the standard cheap-and-real chorus trick, no external DSP asset.
      chorusDelay = ctx.createDelay(0.05); chorusDelay.delayTime.value = 0.022;
      chorusLFO = ctx.createOscillator(); chorusLFO.type = 'sine'; chorusLFO.frequency.value = 0.12;
      chorusLFODepth = ctx.createGain(); chorusLFODepth.gain.value = 0.004; // a few ms depth; raised slightly across Build (see sectionBuild), settled back in Tail
      chorusLFO.connect(chorusLFODepth); chorusLFODepth.connect(chorusDelay.delayTime);
      chorusLFO.start();
      chorusWetGain = ctx.createGain(); chorusWetGain.gain.value = 0.5;
      padChorusSendGain.connect(chorusDelay); chorusDelay.connect(chorusWetGain);

      padPanner = ctx.createStereoPanner();
      padDryGain.connect(padPanner);
      chorusWetGain.connect(padPanner);
      padPanner.connect(master);

      padPanLFO = ctx.createOscillator(); padPanLFO.type = 'sine'; padPanLFO.frequency.value = 0.05;
      padPanLFODepth = ctx.createGain(); padPanLFODepth.gain.value = 0.28;
      padPanLFO.connect(padPanLFODepth); padPanLFODepth.connect(padPanner.pan);
      padPanLFO.start();
    }

    // padChord(t, holdSec, freq): the actual "5 detuned oscillators per
    // sustained note" voice -- -14..+14 cents spread, evenly spaced across
    // 5 voices, phase-randomized start (a few ms of start-time jitter,
    // adaptive-game-audio's documented technique for this exact comb-
    // filtering problem) so the stack doesn't collapse into one flat tone.
    const PAD_DETUNES = [-14, -7, 0, 7, 14];
    function padChord(t, holdSec, freq) {
      const chordGain = ctx.createGain();
      chordGain.gain.setValueAtTime(0.0001, t);
      chordGain.gain.linearRampToValueAtTime(0.30, t + 1.4);       // slow swell in -- a pad, not a pluck
      chordGain.gain.setValueAtTime(0.30, t + Math.max(1.4, holdSec - 1.6));
      chordGain.gain.exponentialRampToValueAtTime(0.0001, t + holdSec);
      chordGain.connect(padLowpass);
      PAD_DETUNES.forEach(cents => {
        const o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.value = freq; o.detune.value = cents;
        o.connect(chordGain);
        o.start(t + Math.random() * 0.01); // phase-randomized start, not a shared instant
        o.stop(t + holdSec + 0.15);
      });
    }

    // Voice 3/6 & 4/6 -- FM lead + FM countermelody. Same recipe (see
    // fmNote below), two separate persistent panners/sends so they read as
    // genuinely two voices in the stereo field, not one voice doubled.
    function buildLeadAndCountermelody() {
      leadPanner = ctx.createStereoPanner(); leadPanner.pan.value = -0.20;
      leadDryGain = ctx.createGain(); leadDryGain.gain.value = 0.0001;
      leadReverbSendGain = ctx.createGain(); leadReverbSendGain.gain.value = 0.0001;
      leadPanner.connect(leadDryGain); leadDryGain.connect(master);
      leadPanner.connect(leadReverbSendGain); // -> reverbInputBus, wired in buildReverb() below

      cmPanner = ctx.createStereoPanner(); cmPanner.pan.value = 0.24; // opposite side from the lead
      cmDryGain = ctx.createGain(); cmDryGain.gain.value = 0.0001;
      cmReverbSendGain = ctx.createGain(); cmReverbSendGain.gain.value = 0.0001;
      cmPanner.connect(cmDryGain); cmDryGain.connect(master);
      cmPanner.connect(cmReverbSendGain); // -> reverbInputBus, wired in buildReverb() below
    }

    // fmNote(): the shared FM synthesis primitive -- a sine modulator at
    // 2x the carrier frequency, scaled by a per-note modulation-index gain,
    // feeding the carrier's own .frequency AudioParam (real FM synthesis,
    // not a filter/waveshaper approximation of it). `dest` is the
    // persistent StereoPannerNode (leadPanner or cmPanner) this note
    // belongs to -- notes never create their own panner.
    function fmNote(freq, t, dur, vel, dest, fmIndex) {
      const carrier = ctx.createOscillator(); carrier.type = 'sine'; carrier.frequency.value = freq;
      const modulator = ctx.createOscillator(); modulator.type = 'sine'; modulator.frequency.value = freq * 2;
      const modGain = ctx.createGain();
      modGain.gain.value = freq * 2 * fmIndex; // Hz of peak deviation = index * modulator frequency
      modulator.connect(modGain); modGain.connect(carrier.frequency);

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vel, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      carrier.connect(g); g.connect(dest);

      carrier.start(t); modulator.start(t);
      carrier.stop(t + dur + 0.05); modulator.stop(t + dur + 0.05);
    }

    // Voice 5/6 -- soft pulse: free-timed, deliberately NOT locked to the
    // section timeline's own clock -- fired from schedulerTick()'s own
    // nextPulseAt check (the same "elapsed-time lookahead, not a fixed
    // grid" idiom Music's fireHeartbeat() already uses one module over),
    // dry and centered, no reverb send -- transient clarity, the same
    // reasoning already protecting SFX's four one-shots from a reverb tail.
    function buildPulseBus() {
      pulseBus = ctx.createGain(); pulseBus.gain.value = 1;
      pulseBus.connect(master);
    }
    function firePulse(t) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      g.connect(pulseBus);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(55, t + 0.14);
      o.connect(g); o.start(t); o.stop(t + 0.16);
    }

    // Voice 6/6 -- shimmer: sparse highpassed noise-burst sparkle, mostly
    // wet through the reverb send with a light dry tap for presence.
    function buildShimmerBus() {
      shimmerDryGain = ctx.createGain(); shimmerDryGain.gain.value = 0.0001;
      shimmerReverbSendGain = ctx.createGain(); shimmerReverbSendGain.gain.value = 0.0001;
      shimmerDryGain.connect(master);
      // -> reverbInputBus, wired in buildReverb() below
    }
    function fireShimmer(t) {
      const dur = 0.11;
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4200; hp.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(hp); hp.connect(g);
      g.connect(shimmerDryGain); g.connect(shimmerReverbSendGain);
      src.start(t);
    }

    // The one deliberate constraint change (see module-level comment) --
    // synthesized convolution reverb, built ONCE here, exactly the
    // adaptive-game-audio technique (exponentially-decaying stereo noise
    // burst). Fed ONLY by lead/countermelody/shimmer -- never sub-bass
    // (would mud the low end) and never the pulse (needs transient clarity,
    // per the task brief's own explicit scoping of this reverb send).
    function buildReverb() {
      reverbInputBus = ctx.createGain(); reverbInputBus.gain.value = 1;
      const tailSec = 1.3; // "produced," not cavernous -- tuned by ear, see the task report
      const len = Math.floor(ctx.sampleRate * tailSec);
      reverb = ctx.createConvolver();
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.0);
      }
      reverb.buffer = buf;
      reverbWetGain = ctx.createGain(); reverbWetGain.gain.value = 0.55;
      reverbInputBus.connect(reverb); reverb.connect(reverbWetGain); reverbWetGain.connect(master);

      leadReverbSendGain.connect(reverbInputBus);
      cmReverbSendGain.connect(reverbInputBus);
      shimmerReverbSendGain.connect(reverbInputBus);
    }

    // ---- Section timeline: a real 32s cycle (not one long automation ramp,
    // not a single buffer) -- each function below is called once per cycle
    // (or on demand via _test.previewFromSection) at its own scheduled
    // absolute time `t`; see schedulerTick() for how `t` is derived, and
    // note-level events inside each section schedule themselves at t+offset
    // via setValueAtTime/exponentialRampToValueAtTime, the correct idiom
    // for events scheduled into the near future rather than fired "now."
    function sectionStatement(t) {
      rampGain(padDryGain.gain, 0.16, 1.6);
      rampGain(padChorusSendGain.gain, 0.11, 1.6);
      rampGain(leadDryGain.gain, 0.5, 1.0);
      rampGain(leadReverbSendGain.gain, 0.34, 1.0);

      padChord(t, T_TAIL - T_STATEMENT + 1.5, N.C4); // held under Statement+Build+into Full, decays into Tail

      // The motif quote -- ringOutStinger's own exact root-then-fifth
      // gesture, 70ms apart -- then the extended C-pentatonic phrase.
      fmNote(N.C6, t, 0.5, 0.30, leadPanner, LEAD_FM_INDEX);
      fmNote(N.G6, t + 0.07, 0.6, 0.30, leadPanner, LEAD_FM_INDEX);
      fmNote(N.C5, t + 0.60, 0.42, 0.26, leadPanner, LEAD_FM_INDEX);
      fmNote(N.E5, t + 1.00, 0.42, 0.26, leadPanner, LEAD_FM_INDEX);
      fmNote(N.G5, t + 1.40, 0.46, 0.27, leadPanner, LEAD_FM_INDEX);
      fmNote(N.A5, t + 1.90, 0.50, 0.28, leadPanner, LEAD_FM_INDEX);
      fmNote(N.G5, t + 2.40, 0.46, 0.25, leadPanner, LEAD_FM_INDEX);
      fmNote(N.C5, t + 2.90, 0.70, 0.24, leadPanner, LEAD_FM_INDEX);

      pulseActive = true;
      nextPulseAt = t;
    }

    function sectionBuild(t) {
      rampGain(cmDryGain.gain, 0.22, 1.4);
      rampGain(cmReverbSendGain.gain, 0.20, 1.4);
      rampGain(shimmerDryGain.gain, 0.10, 1.2);
      rampGain(shimmerReverbSendGain.gain, 0.55, 1.2);
      // Subtle chorus-depth increase across the Build's own fixed duration
      // -- ONE scheduled ramp over a fixed span (the riser pattern), not a
      // per-frame write; nothing else in this module ever touches
      // chorusLFODepth.gain, so it can never collide with a continuous
      // update the way the "dying sticks the music" bug did in Music.
      rampGain(chorusLFODepth.gain, 0.007, T_FULL - T_BUILD);

      padChord(t + 0.4, T_TAIL - T_BUILD - 0.4 + 1.5, N.G4); // a second, higher open-fifth voice layered under the countermelody

      // Countermelody: its own quiet echo of the motif gesture one octave
      // down from the lead's opening quote, then a short pentatonic answer
      // -- panned opposite the lead (cmPanner), gentler FM index
      // (CM_FM_INDEX). This is the piece's one "a new instrument arrives"
      // moment, not a wall-to-wall doubling of the lead from the start.
      fmNote(N.C5, t, 0.55, 0.16, cmPanner, CM_FM_INDEX);
      fmNote(N.G5, t + 0.07, 0.6, 0.16, cmPanner, CM_FM_INDEX);
      fmNote(N.A5, t + 0.9, 0.5, 0.14, cmPanner, CM_FM_INDEX);
      fmNote(N.G5, t + 1.5, 0.5, 0.13, cmPanner, CM_FM_INDEX);
      fmNote(N.E5, t + 2.1, 0.5, 0.13, cmPanner, CM_FM_INDEX);
      fmNote(N.D5, t + 2.7, 0.6, 0.12, cmPanner, CM_FM_INDEX);
      fmNote(N.G5, t + 4.5, 0.45, 0.12, cmPanner, CM_FM_INDEX);
      fmNote(N.E5, t + 5.1, 0.5, 0.11, cmPanner, CM_FM_INDEX);
      fmNote(N.D5, t + 5.7, 0.6, 0.11, cmPanner, CM_FM_INDEX);

      fireShimmer(t + 0.5);
      fireShimmer(t + 3.6);
      fireShimmer(t + 6.8);
    }

    function sectionFull(t) {
      // The lead plays the complete phrase over the full texture and
      // resolves back onto the open C6/G6 fifth, held out into the Tail's
      // decay -- the piece's one "everyone's in, this is the statement"
      // moment.
      fmNote(N.C5, t, 0.44, 0.28, leadPanner, LEAD_FM_INDEX);
      fmNote(N.D5, t + 0.50, 0.40, 0.27, leadPanner, LEAD_FM_INDEX);
      fmNote(N.E5, t + 0.90, 0.40, 0.27, leadPanner, LEAD_FM_INDEX);
      fmNote(N.G5, t + 1.40, 0.44, 0.28, leadPanner, LEAD_FM_INDEX);
      fmNote(N.A5, t + 1.90, 0.44, 0.29, leadPanner, LEAD_FM_INDEX);
      fmNote(N.G5, t + 2.40, 0.44, 0.26, leadPanner, LEAD_FM_INDEX);
      fmNote(N.E5, t + 2.90, 0.40, 0.25, leadPanner, LEAD_FM_INDEX);
      fmNote(N.D5, t + 3.30, 0.42, 0.24, leadPanner, LEAD_FM_INDEX);
      fmNote(N.C6, t + 3.80, 0.55, 0.30, leadPanner, LEAD_FM_INDEX);   // octave lift, building toward the resolution
      fmNote(N.G6, t + 4.50, 0.60, 0.30, leadPanner, LEAD_FM_INDEX);
      fmNote(N.C6, t + 5.20, 1.4, 0.28, leadPanner, LEAD_FM_INDEX);    // the resolution -- held open fifth
      fmNote(N.G6, t + 5.90, 2.0, 0.30, leadPanner, LEAD_FM_INDEX);

      fireShimmer(t + 1.2);
      fireShimmer(t + 4.0);
    }

    function sectionTail(t) {
      pulseActive = false;
      rampGain(padDryGain.gain, 0.0001, 2.6);
      rampGain(padChorusSendGain.gain, 0.0001, 2.6);
      rampGain(leadDryGain.gain, 0.0001, 2.2);
      rampGain(leadReverbSendGain.gain, 0.0001, 2.2);
      rampGain(cmDryGain.gain, 0.0001, 1.8);
      rampGain(cmReverbSendGain.gain, 0.0001, 1.8);
      rampGain(shimmerDryGain.gain, 0.0001, 1.8);
      rampGain(shimmerReverbSendGain.gain, 0.0001, 1.8);
      rampGain(chorusLFODepth.gain, 0.004, 2.0); // settle back to Statement's own baseline before the next cycle's Build re-raises it
      // Sub-bass is deliberately untouched here -- it's what the next
      // cycle's Intro finds already running, see buildSubBass()'s comment.
    }

    const SECTION_EVENTS = [
      { name: 'statement', offset: T_STATEMENT, fn: sectionStatement },
      { name: 'build', offset: T_BUILD, fn: sectionBuild },
      { name: 'full', offset: T_FULL, fn: sectionFull },
      { name: 'tail', offset: T_TAIL, fn: sectionTail },
    ];

    // The standard Web Audio lookahead-scheduler pattern (see
    // iridescentcosmology.html's schedulerTick(), same shape): walk the
    // section-event list against the real audio clock a fraction of a
    // second ahead, on a fast setInterval, rather than firing off rAF --
    // deliberately NOT Music's own tick()/rAF pattern, which is right for
    // continuous smoothed parameters but wrong for discrete note/section
    // events (see adaptive-game-audio's "one-shot vs continuous" rule).
    function schedulerTick() {
      if (!ctx || stopped) return;
      const LOOKAHEAD = 0.15;
      while (eventIdx < SECTION_EVENTS.length && cycleAnchorTime + SECTION_EVENTS[eventIdx].offset <= ctx.currentTime + LOOKAHEAD) {
        SECTION_EVENTS[eventIdx].fn(cycleAnchorTime + SECTION_EVENTS[eventIdx].offset);
        eventIdx++;
      }
      if (eventIdx >= SECTION_EVENTS.length && ctx.currentTime + LOOKAHEAD >= cycleAnchorTime + CYCLE_SEC) {
        cycleAnchorTime += CYCLE_SEC;
        eventIdx = 0;
      }
      if (pulseActive && ctx.currentTime >= nextPulseAt) {
        firePulse(ctx.currentTime + 0.02);
        nextPulseAt = ctx.currentTime + 1.8 + (Math.random() * 0.3 - 0.15); // free-timed -- deliberately not quantized to any grid, this is a menu, not a rhythm cue
      }
    }

    // Silences every layer except the sub-bass anchor. Used by
    // _test.previewFromSection() before jumping straight into a requested
    // section, so auditioning e.g. 'build' twice in a row doesn't leave the
    // previous jump's voices ringing under the new one.
    function hushAllExceptSubBass(seconds) {
      pulseActive = false;
      [padDryGain, padChorusSendGain, leadDryGain, leadReverbSendGain,
        cmDryGain, cmReverbSendGain, shimmerDryGain, shimmerReverbSendGain]
        .forEach(g => rampGain(g.gain, 0.0001, seconds));
    }

    // Fast-iteration hook for tuning this composition by ear (see the task
    // report) -- jumps straight into a section instead of sitting through
    // up to 32s from zero every time. Fires the requested section
    // IMMEDIATELY (not just re-pointed at the scheduler and left to wait),
    // then re-anchors the cycle transport so normal progression resumes
    // into the NEXT section afterward at a realistic elapsed pace.
    function previewFromSection(name) {
      if (!started || stopped) return false;
      hushAllExceptSubBass(0.25);
      const t = ctx.currentTime + 0.05;
      if (name === 'intro') {
        cycleAnchorTime = t; eventIdx = 0;
        return true;
      }
      const idx = SECTION_EVENTS.findIndex(e => e.name === name);
      if (idx === -1) return false;
      SECTION_EVENTS[idx].fn(t);
      cycleAnchorTime = t - SECTION_EVENTS[idx].offset;
      eventIdx = idx + 1;
      return true;
    }

    // Stop lifecycle -- window.reopenRyknduMenu() never calls this again
    // once fired (see hideRyknduMenu()'s own call site comment for why
    // layering this back over a live Music score would contradict the
    // point of this module). Scheduler halted FIRST so nothing new gets
    // scheduled mid-teardown (adaptive-game-audio's own ordering rule),
    // then the master fade, then every oscillator this module ever started
    // and never gave its own per-note .stop() time (sub-bass + the two
    // LFOs) gets one, scheduled past the fade.
    function stop() {
      if (!started || stopped) return;
      stopped = true;
      if (schedulerHandle) { clearInterval(schedulerHandle); schedulerHandle = null; }
      const FADE = 1.6;
      rampGain(master.gain, 0.0001, FADE);
      const stopAt = ctx.currentTime + FADE + 0.05;
      subC.o.stop(stopAt);
      subG.o.stop(stopAt);
      chorusLFO.stop(stopAt);
      padPanLFO.stop(stopAt);
    }

    return {
      ensureCtx, stop,
      _test: {
        isStarted: () => started,
        isStopped: () => stopped,
        masterGain: () => master ? master.gain.value : null,
        previewFromSection,
        // Deeper introspection for tuning-by-ear (see the task report's
        // "judgment calls" list) and for tests/rig-title-theme.js -- exposes
        // exactly the values worth reading live rather than trusting the
        // code that sets them, per adaptive-game-audio's own verification
        // discipline.
        busGains: () => ({
          padDry: padDryGain.gain.value, padChorus: padChorusSendGain.gain.value,
          leadDry: leadDryGain.gain.value, leadReverb: leadReverbSendGain.gain.value,
          cmDry: cmDryGain.gain.value, cmReverb: cmReverbSendGain.gain.value,
          shimmerDry: shimmerDryGain.gain.value, shimmerReverb: shimmerReverbSendGain.gain.value,
          subBass: subBassGain.gain.value, chorusDepth: chorusLFODepth.gain.value,
        }),
        reverbTailSamples: () => reverb && reverb.buffer ? reverb.buffer.length : null,
        reverbTailSeconds: () => reverb && reverb.buffer ? reverb.buffer.length / ctx.sampleRate : null,
        fmModGainFor: (freq, isLead) => freq * 2 * (isLead ? LEAD_FM_INDEX : CM_FM_INDEX),
        leadFmIndex: () => LEAD_FM_INDEX,
        cmFmIndex: () => CM_FM_INDEX,
      }
    };
  })();

  const PULSE_THRESHOLDS = [0.4, 0.7, 0.9]; // fraction of ENEMY_TRAVEL_MS at which each proximityPulse stage fires

  // ---- Juice: particles, screen shake, hit/miss flash ----
  // Pure presentation, deliberately kept separate from collision/timing math
  // (same separation wonderland's own Juice module guarantees) -- none of
  // this reads or writes seq/seqIdx/enemy positions used for hit detection.
  // Scope decision: true hitstop (freezing the timing clock on impact) was
  // considered and left out of this pass -- it would require threading a
  // paused "virtual now" through updateSeq/currentPose/startAttack, which
  // currently read performance.now() directly, and that's real invasive risk
  // to the just-stabilized timing system for a nice-to-have effect when
  // flash+punch+particles+shake already deliver most of the impact.
  function lerpColor(c1, c2, t) {
    const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
    const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
    return 'rgb(' + Math.round(lerp(ar, br, t)) + ',' + Math.round(lerp(ag, bg, t)) + ',' + Math.round(lerp(ab, bb, t)) + ')';
  }

  const MAX_PARTICLES = 40;
  let particles = [];
  let shakeMag = 0;   // decaying px magnitude, applied as a random canvas offset
  let missFlash = 0;  // 0..1, decaying -- translucent full-canvas danger-tint on a miss

  // prefers-reduced-motion (v0.1.8): OS-level signal only -- this file has no
  // settings menu/Persist module to layer a manual override on the way
  // wonderland.html/sigilchain.html's Settings module does, and building one
  // is out of scope for a rendering/feel pass. Still closes a real gap: this
  // was the one file in the studio with zero handling for it, despite being
  // the most shake/flash-heavy of the three. Gates screen shake and the
  // full-bleed missFlash, the two motion-heavy effects here.
  let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', (e) => { reducedMotion = e.matches; });

  function spawnBurst(x, y) {
    const count = 10;
    for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 140 + Math.random() * 80;
      particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0.3 + Math.random() * 0.2, maxLife: 0.5, color: '#ff4d70' });
    }
    for (let i = 0; i < 3 && particles.length < MAX_PARTICLES; i++) {
      const a = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 40;
      particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0.2, maxLife: 0.2, color: '#ffffff' });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---- Enemies ----
  // Autonomous: enemies spawn and approach on their own schedule, independent
  // of when the player attacks. Previously the "enemy" only ever existed as
  // a side effect of the player's own startAttack() call, which meant it
  // could never actually threaten the player — this is the fix for that.
  //
  // These numbers are first guesses, same convention as the pose timings:
  // expect to hand-tune once this is being watched, not read as final.
  const ENEMY_HIT_RADIUS = 45;    // generous hitbox around the enemy, for the player's kicking foot
  const ENEMY_MELEE_REACH = 55;   // how close (px from the pelvis) an enemy gets before it "lands" a hit
  const ENEMY_TRAVEL_MS = 600;    // spawn-to-contact time; within this rig's own ~430-700ms derived floor
  const ENEMY_SPAWN_GAP_MS = 550; // gap after an enemy resolves before the next one spawns
  const ENEMY_DEATH_DUR = 220;    // ms a killed enemy lingers as a fading flash before its slot clears

  // Visible size: quality-pass finding (visual-art-director) -- base 22px
  // radius growing to 34px as the enemy nears melee range (t 0.65 to 1.0),
  // reusing the travel fraction updateEnemies() already computes rather than
  // adding a second timer. Old flat 14px radius (9.4:1 vs the rig's height)
  // was a directly-reported readability failure. Growth also functions as a
  // telegraph -- the dot visibly swelling is itself a "get ready" cue.
  const ENEMY_RADIUS_BASE = 22, ENEMY_RADIUS_PEAK = 34, ENEMY_GROW_START = 0.65;
  // Color: was #c0392b, matching neither shipped game's --danger token
  // (#ff4d70, identical in wonderland.html and sigilchain.html) -- untokenized
  // hex drift the studio's cross-game convention exists to catch. Telegraph
  // color lerps toward #ff8da0, also reused verbatim from wonderland's own
  // hp-bar danger gradient, not a new color relationship.
  const ENEMY_COLOR_BASE = '#ff4d70', ENEMY_COLOR_PEAK = '#ff8da0';

  let enemies = [];
  let nextSpawnAt = 1000; // small initial grace period before the first enemy
  let killCount = 0;
  let missedCount = 0;

  // ---- Session ----
  // Phase 3 of the plan of action: the previous builds had real hit
  // detection and real feedback but no actual stakes -- an unanswered
  // enemy just incremented a counter forever. MAX_MISSES is the plan's
  // suggested 3-5-miss "winnable but threatening" pool, first-guess like
  // every other number here. A "gauntlet": endless single-enemy encounters,
  // scored by kill count, ending on the lives pool running out -- not a
  // health-bar boss fight, which the studio explicitly didn't build toward.
  const MAX_MISSES = 5;
  let sessionState = 'playing'; // 'playing' | 'lose'
  // Timestamp (performance.now()) the moment sessionState flips to 'lose' --
  // drives the GAME OVER card's easeOutBack entrance (see its render block
  // below). 0 while playing/reset, same sentinel convention matchOverStartTime
  // below uses.
  let loseStartTime = 0;

  function resetSession() {
    p1.reset();
    enemies = []; nextSpawnAt = performance.now() + 1000;
    killCount = 0; missedCount = 0;
    particles = []; shakeMag = 0; missFlash = 0;
    sessionState = 'playing';
    loseStartTime = 0;
  }

  function makeEnemy(spawnAt, side) {
    const pelvisX = W / 2 + p1.posX * renderScale; // player 1 now has a real, movable position (v0.1.17 physics) instead of always standing at screen center; small attack-time pelvisDX lean is still ignored here. *renderScale matches solveRig()'s own cx formula exactly -- without it, this drifts from the player's actual rendered/hit-tested position the instant renderScale != 1 (any viewport narrower than RENDER_SCALE_REFERENCE_WIDTH), sending enemies toward a stale contact point
    const spawnX = side === 'R' ? W + 50 : -50;
    const contactX = side === 'R' ? pelvisX + ENEMY_MELEE_REACH : pelvisX - ENEMY_MELEE_REACH;
    return { side, spawnAt, spawnX, contactX, x: spawnX, y: H * 0.78 - 30, alive: true,
      t: 0, dying: false, deathT: 0,
      pulsesFired: [false, false, false] }; // tracks which PULSE_THRESHOLDS stages this enemy has already fired
  }

  function updateEnemies(now, dt) {
    if (enemies.length === 0 && now >= nextSpawnAt) {
      enemies.push(makeEnemy(now, Math.random() < 0.5 ? 'L' : 'R'));
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.dying) {
        e.deathT += dt * 1000;
        if (e.deathT >= ENEMY_DEATH_DUR) enemies.splice(i, 1);
        continue;
      }
      const t = Math.min(1, (now - e.spawnAt) / ENEMY_TRAVEL_MS);
      e.t = t;
      e.x = lerp(e.spawnX, e.contactX, t);
      // Fire each proximity-pulse stage once, the frame its threshold is
      // crossed — an event-gated one-shot, not a per-frame ramp (see SFX
      // module comment). This is the audio cue for the approach itself,
      // independent of windup/strike/miss.
      for (let stage = 0; stage < PULSE_THRESHOLDS.length; stage++) {
        if (!e.pulsesFired[stage] && t >= PULSE_THRESHOLDS[stage]) {
          e.pulsesFired[stage] = true;
          SFX.proximityPulse(stage);
        }
      }
      if (t >= 1) {
        // Reached melee range with no correct-side hit landed in time.
        missedCount++;
        SFX.missBuzz();
        missFlash = reducedMotion ? 0.4 : 1;
        shakeMag = Math.min(20, shakeMag + (reducedMotion ? 1 : 3)); // weaker tier than a kill's +6 -- distinct weight, not just a color
        p1.triggerFlinch();
        enemies.splice(i, 1);
        nextSpawnAt = now + ENEMY_SPAWN_GAP_MS;
        if (missedCount >= MAX_MISSES) { sessionState = 'lose'; loseStartTime = now; }
      }
    }
  }

  // Only checked during the strike phase specifically (not windup/recover) —
  // reads the kicking foot's real world position from solveRig(), which is
  // exactly what the v0.1.4 refactor exists to make possible.
  function resolveHits(now, joints) {
    // Scope decision (second attack type pass): the Gauntlet stays
    // kick-only. The enemy dots have no separate high/low hurtbox to
    // punch at -- every design doc only ever describes this mode as "the
    // same kick, resolveHits()" -- and this pass's punch is explicitly a
    // Duel showcase of combat depth between two skilled players, not
    // solo enemy-dot survival (see checkPvpHit()/resolveDuelHit()'s own
    // comments for the Duel-side implementation). Input isn't gated by
    // mode (SHOW_GAUNTLET only hides rendering -- GAME_5_PILLARS.md §3),
    // so a player COULD throw a punch while playing the Gauntlet; this
    // guard makes that a harmless whiff instead of silently reading the
    // kick foot socket while a punch pose is actually playing (which
    // could otherwise coincidentally register a kill if the idle-braced
    // kicking leg happened to overlap an enemy during a punch's own
    // strike phase).
    if (p1.idle || p1.seqIdx !== 1 || !p1.attackSide || p1.attackType === 'punch') return;
    const sockets = getSockets(joints);
    const foot = p1.attackSide === 'R' ? sockets.foot_r : sockets.foot_l;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.dying || e.side !== p1.attackSide) continue;
      const dx = foot.x - e.x, dy = foot.y - e.y;
      if (Math.sqrt(dx * dx + dy * dy) <= ENEMY_HIT_RADIUS) {
        // Not an instant splice -- linger briefly as a fading flash (see
        // drawEnemies()) so the kill actually reads as an impact, not a
        // silent disappearance. Excluded from further hit/miss checks above
        // via the e.dying guard.
        e.dying = true; e.deathT = 0;
        killCount++;
        SFX.strikeImpact();
        Music.duck();
        spawnBurst(e.x, e.y);
        shakeMag = Math.min(20, shakeMag + (reducedMotion ? 2 : 6));
        nextSpawnAt = now + ENEMY_SPAWN_GAP_MS;
      }
    }
  }

  // ---- Rig-vs-rig combat resolution (Game 5's actual core mechanic) ----
  // checkPvpHit()/resolveDuelHit() are called from BOTH directions --
  // (p1 attacking p2) and (p2 attacking p1) -- through the same two
  // functions with the attacker/defender arguments swapped, never two
  // hand-copied blocks. That's the identical reasoning behind mirror()
  // and createRigController() itself: two copies of the same math are
  // exactly the kind of thing that silently drifts apart later.
  //
  // Guard doesn't fully no-sell a hit (GUARD_CHIP_SCALE) -- a block still
  // costs the defender a little ground, so guard is a real mitigation, not
  // a free wall. KNOCKBACK_SPEED is well above MOVE_MAX_SPEED (220px/sec,
  // the fastest voluntary walking ever gets) specifically so a landed hit
  // is unmistakably more forceful than movement itself, not just a faster
  // walk in one direction.
  const PVP_HIT_RADIUS = 50; // generous, matching ENEMY_HIT_RADIUS's own generosity for a kicking foot vs. a whole-body hurtbox
  const KNOCKBACK_SPEED = 480; // px/sec -- the kick's own value, UNCHANGED
  // Punch's own knockback (second attack type) -- a jab reads as quicker
  // and less forceful than a full kick, the conventional low/high-
  // commitment relationship a jab-vs-kick pairing always has (see
  // attackSequence()'s own comment for the matching tempo difference).
  // 320 keeps KNOCKBACK_SPEED's own design property (well above
  // MOVE_MAX_SPEED=220, so a landed hit still reads as unmistakably more
  // forceful than movement itself -- 320/220 = 1.45x) while staying
  // meaningfully below the kick's 480 (0.67x) -- a punch still knocks the
  // defender back, just less than a kick does.
  const PUNCH_KNOCKBACK_SPEED = 320; // px/sec
  const GUARD_CHIP_SCALE = 0.2; // a blocked hit still pushes the defender back a little
  // Combo-cancel knockback fix (Part B of the second attack type pass) --
  // see resolveDuelHit()'s own comment at its call site for what this
  // fixes and the exact drift math it's solved against.
  const COMBO_KNOCKBACK_SCALE = 0.4;

  // Attack-type socket selection (second attack type) -- kick keeps
  // reading foot_r/foot_l exactly as before; punch reads hand_r/hand_l
  // instead, per the same "query sockets by name" convention getSockets()
  // itself establishes.
  function attackWeaponSocket(sockets, side, type) {
    if (type === 'punch') return side === 'R' ? sockets.hand_r : sockets.hand_l;
    return side === 'R' ? sockets.foot_r : sockets.foot_l; // kick (also the default for an omitted/undefined type)
  }
  // Punch targets a HIGHER hurtbox than the kick's ankle-height `stance`
  // -- `back` (solveRig()'s chest joint, see getSockets()) is reused here
  // rather than adding a new socket, the same "position-only, query by
  // name" reuse `stance` itself set the precedent for. This gives kick
  // and punch a real high/low read (kick = ankle, punch = chest) -- a
  // genuine foundation for a future high/low guard mix-up, though guard
  // itself doesn't yet distinguish high vs low blocks (named here, not
  // built -- out of this pass's scope).
  function attackHurtboxSocket(sockets, type) {
    return type === 'punch' ? sockets.back : sockets.stance;
  }

  // Returns the defender's hurtbox point on a landed hit, or null -- never
  // a bare boolean, so the caller (which needs the exact contact point for
  // spawnBurst()'s impact particles) doesn't have to re-solve either rig's
  // pose a second time to get it.
  function checkPvpHit(attacker, defender, attackerJoints, defenderJoints) {
    if (attacker.idle || attacker.seqIdx !== 1 || !attacker.attackSide) return null; // only the strike phase counts -- same convention resolveHits() uses against the enemy dots
    if (attacker.hasHitThisSwing) return null; // one landed hit per strike, not once per frame the strike phase happens to overlap the defender
    const towardDefender = defender.posX >= attacker.posX ? 'R' : 'L';
    if (attacker.attackSide !== towardDefender) return null; // attacking away from the opponent can't land on them
    const type = attacker.attackType || 'kick';
    const weapon = attackWeaponSocket(getSockets(attackerJoints), attacker.attackSide, type);
    const hurtbox = attackHurtboxSocket(getSockets(defenderJoints), type); // ankle height for a kick, chest height for a punch -- see attackHurtboxSocket()'s own comment
    const dx = weapon.x - hurtbox.x, dy = weapon.y - hurtbox.y;
    // *renderScale (not a bare PVP_HIT_RADIUS pixel comparison): weapon/
    // hurtbox are both solveRig() output, scaled by renderScale on a
    // narrow viewport (see resize()'s own comment) -- a fixed pixel
    // threshold would make combat range effectively bigger in world-space
    // terms on a small screen than on a desktop-width one. Scaling the
    // threshold the same way keeps the real world-space hit range
    // identical regardless of device, matching every other physics
    // constant (ARENA_BOUND, KNOCKBACK_SPEED, MOVE_MAX_SPEED) already
    // being pure world-units untouched by renderScale.
    if (Math.sqrt(dx * dx + dy * dy) > PVP_HIT_RADIUS * renderScale) return null;
    return hurtbox;
  }

  function resolveDuelHit(attacker, defender, attackerJoints, defenderJoints) {
    const hurtbox = checkPvpHit(attacker, defender, attackerJoints, defenderJoints);
    if (!hurtbox) return;
    attacker.markHit();
    const dir = defender.posX >= attacker.posX ? 1 : -1;
    const blocked = defender.guarding;
    // Type-specific base knockback (second attack type) -- see
    // PUNCH_KNOCKBACK_SPEED's own comment for why it's lower than the
    // kick's KNOCKBACK_SPEED, not a copy-pasted number with a new pose.
    const kbSpeed = attacker.attackType === 'punch' ? PUNCH_KNOCKBACK_SPEED : KNOCKBACK_SPEED;
    // Parry (v0.1.25): a hit landing within the defender's PARRY_WINDOW_MS
    // of the moment guard was raised is NOT a block -- it's a full
    // negation plus a real punish. The defender takes zero knockback and
    // zero guard-meter cost (this is the precision-timing reward guard
    // never had); the ATTACKER is the one who gets knocked back instead,
    // pushed AWAY from the defender (-dir, the opposite of the direction
    // a normal hit would push the defender), interrupting whatever THEY
    // were doing exactly the way applyKnockback()'s unblocked branch
    // already does for a landed hit. Uses kbSpeed (not always
    // KNOCKBACK_SPEED) so a parried punch punishes proportionally to what
    // was actually thrown, the same as a landed hit already does.
    if (blocked && defender.isInParryWindow()) {
      attacker.applyKnockback(-dir * kbSpeed, false);
      SFX.parryChime();
      Music.duck();
      Music.parryStinger();
      spawnBurst(hurtbox.x, hurtbox.y);
      shakeMag = Math.min(20, shakeMag + (reducedMotion ? 2 : 6));
      return;
    }
    // Combo-cancel knockback fix (Part B) -- a prior review found that at
    // full knockback, a confirmed kick->kick cancel could carry the
    // DEFENDER far enough during the buffered follow-up's own windup that
    // it whiffs even though the cancel is "confirmed": under
    // MOVE_FRICTION (1800px/s^2) decay from a full KNOCKBACK_SPEED (480)
    // impulse, the defender drifts 480*0.11 - 0.5*1800*0.11^2 = 41.9px
    // during just a kick follow-up's own 110ms windup (still accelerating
    // away the entire time, since 480/1800=267ms > 110ms) -- eating 84% of
    // the entire 50px PVP_HIT_RADIUS budget before the follow-up's strike
    // phase even begins, since checkPvpHit()'s closest possible re-check
    // is the instant strike starts (the defender only moves FARTHER away
    // after that, not back). COMBO_KNOCKBACK_SCALE=0.4 applies a scaled
    // impulse of 480*0.4=192px/s, provably bounded at 192^2/(2*1800)=
    // 10.24px (the impulse fully decays to 0 at 192/1800=106.7ms, so
    // drift can't grow any further once it does), leaving ~40px of
    // margin instead of 8px -- confirmed against the real physics
    // constants already in this file (and live-measured at ~8.7px in
    // tests/rig-second-attack.js §8, the gap from the closed-form 10.24px
    // explained by frame discretization/polling latency), not the
    // suggested 0.5 starting point taken on faith (0.5 -> 240px/s would
    // still be decaying past the kick follow-up's own windup, an
    // open-ended drift rather than a hard cap). A punch follow-up's own
    // shorter 70ms windup is even safer under the same 192px/s impulse
    // (still decaying the whole window: 192*0.07-0.5*1800*0.07^2=9.03px,
    // ~41px of margin) -- not separately covered by a live test today,
    // worth adding if this block is touched again. Only applied on the
    // path that's actually about to fire cancelIntoBufferedAttack()
    // (unblocked, with a follow-up buffered) -- a normal landed hit with
    // nothing buffered, or a blocked hit, keeps its full, unscaled
    // knockback exactly as before.
    const willComboCancel = !blocked && attacker.queuedSide !== null;
    const kbScale = (blocked ? GUARD_CHIP_SCALE : 1) * (willComboCancel ? COMBO_KNOCKBACK_SCALE : 1);
    defender.applyKnockback(dir * kbSpeed * kbScale, blocked);
    if (blocked) {
      defender.damageGuardMeter(GUARD_BLOCK_HIT_DRAIN); // guard mitigates knockback but isn't free -- a real stamina cost per blocked hit, on top of the continuous drain from just holding guard (see updateGuardMeter())
    } else {
      // Combo-cancel (v0.1.26, second attack type extension in
      // cancelIntoBufferedAttack() itself): a clean, unblocked connect is
      // a real confirm, not just a whiff -- if the attacker already
      // buffered a follow-up during their own committed phase, this fires
      // it immediately (now carrying its own TYPE, kick or punch, not
      // just its side) instead of making them wait out the rest of
      // strike plus the full recovery tail. No-op if nothing was buffered.
      attacker.cancelIntoBufferedAttack();
    }
    SFX.strikeImpact();
    Music.duck();
    spawnBurst(hurtbox.x, hurtbox.y);
    shakeMag = Math.min(20, shakeMag + (reducedMotion ? 2 : 6) * (blocked ? 0.4 : 1));
  }

  function resolveCombatHits(joints1, joints2) {
    if (matchOver) return; // the match is decided -- no more hits land until a rematch
    resolveDuelHit(p1, p2, joints1, joints2);
    resolveDuelHit(p2, p1, joints2, joints1);
  }

  // ---- Ring-out (the duel's actual win condition) ----
  // ARENA_BOUND is the same wall voluntary movement already clamps
  // against (see updateMovement()) -- walking can never cross it, so the
  // only way either rig's posX ends up beyond it is a knockback impulse
  // from resolveDuelHit() above, which is exactly what makes "crossed the
  // line" a meaningful ring-out rather than something either player could
  // trigger just by walking there.
  //
  // v0.1.23: a running score alone was never a finished match -- nothing
  // stopped it once either player hit any number, and there was no result
  // to show. MATCH_TARGET_SCORE gives ring-outs an actual endpoint: first
  // to reach it wins the MATCH (not just the exchange), the match freezes
  // (see resolveCombatHits()/frame()'s input gating below) until either
  // player's next attack/jump input calls resetMatch() via tryRematch().
  let p1Score = 0, p2Score = 0;
  let matchOver = false, matchWinner = null; // matchWinner: 'P1' | 'P2' | null
  // Timestamp (performance.now()) the moment matchOver flips true -- drives
  // the match-win card's easeOutBack entrance (see its render block below).
  // Read via performance.now() rather than threading frame()'s own `now`
  // through checkRingOuts()'s signature -- sub-millisecond difference,
  // irrelevant for a ~400ms UI animation, and keeps this function's
  // existing call site (frame(), no args) untouched.
  let matchOverStartTime = 0;
  const MATCH_TARGET_SCORE = 3;
  function checkRingOuts() {
    if (matchOver) return;
    if (Math.abs(p1.posX) > ARENA_BOUND) {
      p2Score++;
      Music.ringOutStinger();
      if (p2Score >= MATCH_TARGET_SCORE) { matchOver = true; matchWinner = 'P2'; matchOverStartTime = performance.now(); Music.matchWinStinger(); }
      resetDuelPositions();
    } else if (Math.abs(p2.posX) > ARENA_BOUND) {
      p1Score++;
      Music.ringOutStinger();
      if (p1Score >= MATCH_TARGET_SCORE) { matchOver = true; matchWinner = 'P1'; matchOverStartTime = performance.now(); Music.matchWinStinger(); }
      resetDuelPositions();
    }
  }
  function resetDuelPositions() {
    // A full reset (not just posX) -- a ring-out ends the exchange
    // entirely, the same way a real round reset would; whichever attack/
    // guard/knockback state either rig was mid-way through no longer
    // means anything once the round position resets under it.
    p1.reset();
    p2.reset();
  }
  // A fresh match: scores AND the decided flag both clear, not just
  // positions -- resetDuelPositions() alone would leave matchOver stuck
  // true forever with no path back to play.
  function resetMatch() {
    p1Score = 0; p2Score = 0; matchOver = false; matchWinner = null;
    matchOverStartTime = 0;
    resetDuelPositions();
  }
  // Called from every real attack-trigger input path (see handleInput()
  // for player 1, and the two player-2 call sites in the Input section
  // below) so EITHER player's next attack press restarts the match --
  // not just whichever one happens to own the session/game-over flow.
  // Returns true if it consumed the input as a rematch (caller should not
  // also throw the attack that triggered it).
  function tryRematch() {
    if (!matchOver) return false;
    resetMatch();
    return true;
  }

  // v0.1.8 feel-pass finding: growth + color-lerp made the enemy telegraph
  // its approach, but it never stopped being a plain ctx.arc() circle -- the
  // producer's original "the dot is so small" complaint was really "it's a
  // dot, period," and sizing/coloring a dot better doesn't change that. This
  // draws a small asymmetric arrowhead/chevron instead: a shape with a nose
  // and a concave back notch, canonically pointing left (-x). Side 'R'
  // enemies travel leftward toward the player, so they use this orientation
  // directly; side 'L' enemies travel rightward, so drawEnemies() mirrors it
  // with ctx.scale(-1,1) rather than hand-authoring a second shape that could
  // drift out of sync (same reasoning as mirror() for the player's own
  // kick poses).
  function drawEnemyShape(radius) {
    ctx.beginPath();
    ctx.moveTo(-radius * 1.3, 0);        // nose
    ctx.lineTo(radius * 0.6, -radius * 0.9);  // upper back corner
    ctx.lineTo(radius * 0.15, 0);        // concave back notch -- what makes it read as an arrow, not a kite
    ctx.lineTo(radius * 0.6, radius * 0.9);   // lower back corner
    ctx.closePath();
    ctx.fill();
  }

  // A distinct "about to strike" state, not just a further point on the
  // continuous grow/color gradient -- the gradient alone reads as "getting
  // closer," not "about to hit." Fires only in the enemy's final approach
  // stretch, well after ENEMY_GROW_START but before contact.
  const ENEMY_STRIKE_WARN_T = 0.85;

  function drawEnemies() {
    for (const e of enemies) {
      if (e.dying) {
        // Punchier kill flash (v0.1.8): the old version was a raw linear
        // alpha/radius falloff and read as a fade, not an impact. Reuses the
        // studio's own "give it weight" easeOutBack idiom (already used for
        // the recovery-phase pose) for a snap-then-settle radius pop, and a
        // fast easeInQuad alpha drop so it stays bright before cutting out
        // sharply, closer to a flash than a fade.
        const dt2 = e.deathT / ENEMY_DEATH_DUR; // 0..1
        const growEased = easeOutBack(Math.min(1, dt2 * 1.4));
        ctx.globalAlpha = Math.max(0, 1 - easeInQuad(dt2));
        ctx.beginPath();
        ctx.arc(e.x, e.y, ENEMY_RADIUS_PEAK * (1 + 0.4 * growEased), 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }
